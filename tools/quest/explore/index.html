<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__PAGE_TITLE__</title>
<meta name="description" content="__PAGE_DESCRIPTION__">
<!-- Written by build.py into <page folder>/explore/ (and, as the home page, into <page folder>/ with a <base>). Everything is local: no outside requests. -->
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="quest.css">
<style>
/* The explore page: the map on the monitor, a dialog over it for every question. */
.monitor { max-width: 1000px; }
#world { position: relative; width: 100%; aspect-ratio: 20 / 8; background: var(--glass); }
#world canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; display: block; }
#world:focus-within { outline: 1px dashed var(--dim); }
.bar-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 8px; }
.bar-top a { color: var(--hot); }
.hud { display: flex; justify-content: space-between; gap: 12px; color: var(--phosphor); margin: 0 0 6px; flex-wrap: wrap; }
.hud span { white-space: nowrap; }
.hud #hud-gold { color: var(--hot); }
.hud #hud-kit { color: var(--dim); }
#toast { min-height: 1.4em; margin: 8px 0 0; color: var(--hot); }
#pad { display: none; gap: 8px; justify-content: center; margin-top: 10px; }
#pad button { font: inherit; font-size: 22px; min-width: 56px; min-height: 48px; background: var(--glass);
              color: var(--phosphor); border: 1px solid var(--dim); border-radius: 4px; touch-action: none; }
@media (pointer: coarse) { #pad { display: flex; } }
dialog { max-width: min(900px, 94vw); width: 100%; max-height: 90vh; overflow: auto; background: var(--glass);
         color: var(--phosphor); border: 1px solid var(--dim); padding: 16px 20px; }
dialog::backdrop { background: rgba(0, 0, 0, 0.7); }
.dialog-head { display: flex; align-items: flex-start; gap: 0.5em; }
.dialog-head .gap { flex: 1; }
#close, #leave { font: inherit; background: none; color: var(--dim); border: 1px solid var(--rule); cursor: pointer; }
#portrait { width: 64px; height: 64px; margin-left: 24px; image-rendering: pixelated; }
@media (max-width: 520px) { #portrait { margin-left: 14px; } }   /* in line with the screen's padding */
/* The map is the picture here: the classic page's ASCII art stays on the classic page. */
#dialog .art { display: none; }
#nogl { display: none; }
[hidden] { display: none !important; }   /* .sound and #pad set display; hidden must still hide them */
@media (prefers-reduced-motion: reduce) { #world canvas { transition: none; } }
</style>
</head>
<body>
<p class="sr-only" id="live" aria-live="polite"></p>
<main class="monitor"><div class="screen">
  <p id="intro">__EXPLORE_INTRO__</p>
  <div class="bar-top"><span id="help"></span><a id="classic" href="__CLASSIC_HREF__">__CLASSIC_TEXT__</a></div>
  <div class="hud" aria-hidden="true"><span id="hud-place"></span><span id="hud-kit"></span><span id="hud-gold"></span></div>
  <div id="world" tabindex="0" aria-label=""></div>
  <p id="toast" role="status"></p>
  <p id="nogl"></p>
  <div id="pad" role="group">
    <button type="button" data-key="left"></button><button type="button" data-key="up"></button>
    <button type="button" data-key="down"></button><button type="button" data-key="right"></button>
    <button type="button" data-key="talk"></button><button type="button" data-key="weapon"></button>
  </div>
  <div class="sound" role="group" aria-label="Sound">
    <button type="button" id="sound-sfx" aria-pressed="true"></button>
    <button type="button" id="sound-music" aria-pressed="false"></button>
  </div>
  <p class="foot" id="about"></p>
</div></main>
<dialog id="dialog" aria-labelledby="dialog-title">
  <h2 class="sr-only" id="dialog-title"></h2>
  <div class="dialog-head">
    <canvas id="portrait" width="16" height="16" aria-hidden="true" hidden></canvas>
    <span class="gap"></span>
    <button type="button" id="leave" hidden></button>
    <button type="button" id="close"></button>
  </div>
  <div class="screen" id="screen"></div>
</dialog>
<pre id="log" hidden></pre>
<script src="engine.js"></script>
<script src="core.js"></script>
<script src="explore.js"></script>
</body>
</html>
