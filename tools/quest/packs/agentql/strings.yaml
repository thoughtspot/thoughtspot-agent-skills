# A quest
gold_tag: GOLD
quest_intro: "A merchant brings a question:"
read_intent: First, read the intent. Which path should Spotter take?
watch_guide: Watch the Wizard write it
choose_again: Choose again
path_label: THE AGENTQL PATH
guide_text: "The *Wizard* is the AI. His only job is to understand the question and write it down. In this game, his AgentQL is your *scroll*:"
carry_scroll: Carry the scroll to the Forge
compiler_text: "The Forge is ThoughtSpot. It never runs the scroll. It compiles it against the Model's rules into warehouse SQL, and from the fire rises a dragon made of that SQL."
legend_label: Who is who
legend_guide: "**Wizard** = the AI"
legend_scroll: "**Scroll** = the AgentQL it wrote"
legend_compiler: "**Forge** = ThoughtSpot + the Model"
legend_foe: "**Dragon** = the SQL that runs"
rule_title: THE RULE OF THE FORGE
rule_text: "Whatever the Forge adds or changes is the Forge's: tables, joins and keys, column names, null guards, LOWER(), the row cap. A shape your scroll asked for, and the SQL keeps, is yours: an outer join, two steps, a ranking. The Wizard only writes the scroll. ThoughtSpot compiles the SQL that runs."
gold_rules: "Each right answer earns {win} gold. A wrong one costs {loss}, but never more than you carry, and you answer again. Invoke magic to see the answer: no gold won or lost."
foe_points: "{n} scales. Say who put each line there, and it breaks. {gold_rules}"
draw_weapon: Draw your weapon
foe_label: DRAGON
try_again: Try again
foe_falls: Watch the dragon fall
