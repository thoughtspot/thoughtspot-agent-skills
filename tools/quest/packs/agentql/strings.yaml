victory_title: The dragon falls
carry_home: "You carry home *{gold} of {max} gold*{record}."
rules_heading: DETERMINISTIC RULES UNCOVERED
rules_note: Added by the Model and ThoughtSpot, not by the AI, and applied the same way every time this AgentQL compiles.
yours_heading: YOUR PART, IN THE AGENTQL
verdict: So the same AgentQL, on the same Model, for the same user, always compiles to the same SQL.
