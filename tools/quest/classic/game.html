<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__PAGE_TITLE__</title>
<meta name="description" content="__PAGE_DESCRIPTION__">
<style>
/* Fonts are inlined by build.py (fonts/, SIL OFL 1.1), so the page makes no outside requests. */
/*__FONT_FACES__*/
/*__QUEST_CSS__*/
</style>
</head>
<body>
<p class="sr-only" id="live" aria-live="polite"></p>
<div class="monitor"><main class="screen" id="screen"></main>
  <div class="sound" role="group" aria-label="Sound">
    <button type="button" id="sound-sfx" aria-pressed="true"></button>
    <button type="button" id="sound-music" aria-pressed="false"></button>
  </div>
  <p class="back-explore" id="back-explore" hidden><a href=""></a></p></div>

<!-- Written by build.py from the pack (content.yaml) + the captured lesson SQL. Do not edit here. -->
<script id="quest-data" type="application/json">__QUEST_DATA__</script>
<script id="classic-art" type="application/json">__CLASSIC_ART__</script>
<script>
/*__QUEST_CORE__*/
// ---- The classic page: draws the state Quest.machine keeps, and turns clicks and keys into its
// actions. Everything else (wording, gold, saves, sound, the rules of play) is in core/. ----------
const QUEST = JSON.parse(document.getElementById("quest-data").textContent);
const REALMS = QUEST.realms;
const SAVE_KEY = QUEST.pack.storage_key;  // saves are <key>-progress and <key>-sound

// The pack's ASCII art (art/classic/*.txt), written in by build.py: title, guide, compiler, foe
// (the lexicon's roles), crown, banner, map, and scene_<realm id> for each realm that has a scene.
const ART = JSON.parse(document.getElementById("classic-art").textContent);

// The pack's wording (strings.yaml): S() plain text (see core/10-text.js), for the sound labels.
const { S } = Quest.wording(QUEST.pack.strings);

// Sound effects and music (core/50-sound.js), saved under <storage key>-sound.
const Sound = Quest.sound(SAVE_KEY, S);

const progress = Quest.progress(REALMS, SAVE_KEY);   // saved under <storage key>-progress
const loadProgress = progress.load;
const machine = Quest.machine(QUEST);

let state;
let actions = [];
function announce(t) { const el = document.getElementById("live"); if (el) el.textContent = t; }

// Every screen's HTML (core/60-screens.js); the page only puts it on the screen.
const screens = Quest.screens({ quest: QUEST, art: ART, progress, machine, state: () => state, announce,
                                choose: list => { actions = list.map(c => c.action); } });
const MUSIC_FOR = screens.MUSIC_FOR;

// Do an action: the machine decides what changes, the page plays its sounds, saves, and redraws.
function dispatch(action) {
  const out = machine.act(state, action, loadProgress());
  if (out.refused) return render();   // nothing changes: redraw, which puts focus back on the first button
  state = out.state;
  for (const fx of out.effects) {
    if (fx.type === "sound") Sound.play(fx.name);
    else if (fx.type === "save") progress.finish(fx.realm, fx.gold);
  }
  render();
}

function render() {
  const el = document.getElementById("screen");
  el.innerHTML = screens.draw(state.screen);
  Sound.music(MUSIC_FOR[state.screen] || "map");
  el.querySelector(".choices button")?.focus({ preventScroll: true });
}

document.addEventListener("click", e => {
  Sound.unlock();
  if (e.target.closest("#sound-sfx")) return Sound.toggle("sfx");
  if (e.target.closest("#sound-music")) return Sound.toggle("music");
  const b = e.target.closest(".choices button");
  if (b && actions[+b.dataset.i]) dispatch(actions[+b.dataset.i]);
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = (e.key || "").toLowerCase();
  if (e.repeat) {   // holding a key must not skip explanations, nor held Enter keep "clicking" the focused button
    if (k === "enter") e.preventDefault();
    return;
  }
  Sound.unlock();
  if (k === "s") { e.preventDefault(); return Sound.toggle("sfx"); }
  if (k === "m") { e.preventDefault(); return Sound.toggle("music"); }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= actions.length) { e.preventDefault(); dispatch(actions[n - 1]); }
});

document.addEventListener("visibilitychange", () => (document.hidden ? Sound.pause() : Sound.resume()));

state = machine.fresh();
// Opened from the explore map at #realm=<id>: start at that realm's gate, with a way back to the map.
const deep = typeof location === "undefined" ? null : /^#realm=([a-z0-9_]+)(&from=explore)?$/.exec(location.hash || "");
const deepRealm = deep ? REALMS.findIndex(r => r.id === deep[1]) : -1;
// The explore map is always a link away (it is the home page when explore_home, this page then in classic/).
const exploreHref = QUEST.pack.explore_home ? "../" : "explore/";
const back = typeof document === "undefined" ? null : document.getElementById("back-explore");
if (QUEST.pack.explore_realms.length && back && back.querySelector && back.querySelector("a")) {
  const a = back.querySelector("a");
  a.textContent = S("explore_back");
  if (a.setAttribute) a.setAttribute("href", exploreHref);
  back.hidden = false;
}
if (deepRealm >= 0 && QUEST.pack.explore_realms.length) {
  for (const a of [{ type: "map" }, { type: "realm", realm: deepRealm }]) state = machine.act(state, a, loadProgress()).state;
  if (deep[2] && back && back.querySelector && back.querySelector("a")) {
    const a = back.querySelector("a");
    if (a.setAttribute) a.setAttribute("href", `${exploreHref}#from=${deep[1]}`);   // back beside this realm's door
  }
}
Sound.label();
render();
// For headless tests (tests/play_quest.js): the page's state, its buttons' actions, and its sound.
Quest.classic = { state: () => state, actions: () => actions, sound: Sound };
</script>
</body>
</html>
