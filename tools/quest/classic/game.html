<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__PAGE_TITLE__</title>
<meta name="description" content="__PAGE_DESCRIPTION__">
<style>
/* Fonts are inlined by build.py (fonts/, SIL OFL 1.1), so the page makes no outside requests. */
/*__FONT_FACES__*/

/* Layout: one amber-phosphor monitor centred on a dark desk; every scene renders inside the glass. */
:root {
  --desk: #0b0805;
  --glass: #150e06;
  --phosphor: #ffb43a;
  --dim: #a8722a;
  --hot: #ffe6b0;
  --blood: #ff6a45;
  --rule: #4a3210;
  --font-game: "VT323", "Courier New", ui-monospace, monospace;
  --font-code: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--desk);
  color: var(--phosphor);
  font-family: var(--font-game);
  font-size: 22px;
  line-height: 1.25;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
}
.monitor {
  max-width: 860px;
  margin: 0 auto;
  border: 2px solid var(--rule);
  border-radius: 18px;
  background: var(--glass);
  box-shadow: 0 0 0 6px #1d1409, 0 0 60px rgba(255,180,58,.08), inset 0 0 80px rgba(0,0,0,.7);
  position: relative;
  overflow: hidden;
}
.monitor::after {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
}
.screen {
  padding: 22px 24px 28px;
  display: grid;
  gap: 14px;
  text-shadow: 0 0 6px rgba(255,180,58,.45);
  min-width: 0;
}
.status {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 18px;
  border-bottom: 1px dashed var(--rule);
  padding-bottom: 8px;
  font-variant-numeric: tabular-nums;
}
.status .lbl { color: var(--dim); letter-spacing: .06em; }
.bar { color: var(--hot); letter-spacing: -1px; }
.bar .gone { color: var(--rule); text-shadow: none; }
h1, h2 { font-weight: 400; margin: 0; text-wrap: balance; }
h2 { font-size: 30px; color: var(--hot); }
p { margin: 0; max-width: 62ch; }
.dim { color: var(--dim); }
.hot { color: var(--hot); }
.art {
  margin: 0;
  font-family: var(--font-game);
  /* Shrinks to fit narrow screens: a VT323 cell is about half its height wide. */
  font-size: min(20px, calc((100vw - 76px) / (var(--cols, 40) * 0.5)));
  line-height: 1.05;
  white-space: pre;
  overflow-x: auto;
}
.art.hot { color: var(--hot); }
.scroll {
  margin: 0;
  font-family: var(--font-code);
  font-size: 13px;
  line-height: 1.55;
  white-space: pre;
  overflow-x: auto;
  padding: 12px 14px;
  border: 1px solid var(--rule);
  background: rgba(0,0,0,.35);
  color: var(--dim);
  text-shadow: none;
}
.scroll .ln { display: block; padding: 0 6px; margin: 0 -6px; }
.scroll .ln.on { background: var(--phosphor); color: var(--glass); font-weight: 600; }
.scroll .agent { color: var(--phosphor); }
.cap { font-size: 18px; color: var(--dim); }
.legend { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 18px; color: var(--dim); }
.legend b { font-weight: 400; color: var(--hot); }
.pane { display: grid; gap: 4px; min-width: 0; }
.pane .lbl { font-size: 18px; color: var(--dim); letter-spacing: .06em; }
.rule-card { border: 1px dashed var(--phosphor); padding: 10px 12px; display: grid; gap: 6px; }
.feedback { border-left: 3px solid var(--hot); padding: 4px 0 4px 12px; display: grid; gap: 6px; }
.feedback.miss { border-color: var(--blood); }
.feedback .tag { color: var(--hot); letter-spacing: .08em; }
.feedback.miss .tag { color: var(--blood); }
.feedback.magic { border-color: var(--dim); }
.choices { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.choices button {
  font: inherit;
  color: var(--phosphor);
  background: transparent;
  border: 1px solid transparent;
  text-align: left;
  padding: 4px 8px;
  width: 100%;
  cursor: pointer;
  text-shadow: inherit;
}
.choices button:hover, .choices button:focus-visible {
  outline: none;
  background: var(--phosphor);
  color: var(--glass);
  text-shadow: none;
}
.choices .key { color: var(--hot); }
.choices button:hover .key, .choices button:focus-visible .key { color: var(--glass); }
.cursor { display: inline-block; width: .6em; background: var(--phosphor); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.foot { font-size: 16px; color: var(--dim); border-top: 1px dashed var(--rule); padding-top: 8px; }
.foot a { color: var(--phosphor); }
.map-list { display: grid; gap: 4px; }
.realm-meta { font-size: 18px; color: var(--dim); }
.tag { color: var(--hot); }
.law { width: 100%; border-collapse: collapse; font-size: 19px; }
.law-wrap { overflow-x: auto; }
.law th, .law td { text-align: left; vertical-align: top; padding: 6px 10px 6px 0; border-bottom: 1px dashed var(--rule); }
.law th { color: var(--hot); font-weight: 400; }
.law td:first-child { color: var(--dim); min-width: 9em; }
.routes { display: grid; gap: 2px; font-size: 18px; color: var(--dim); }
.routes b { font-weight: 400; color: var(--hot); }
.notes { display: grid; gap: 8px; margin: 0; padding-left: 1.2em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.soon { color: var(--hot); letter-spacing: .04em; }
.sound { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: flex-end; padding: 0 24px 14px; position: relative; z-index: 1; }
.sound button { font: inherit; font-size: 17px; color: var(--dim); background: transparent; border: 1px solid var(--rule); padding: 2px 10px; cursor: pointer; }
.sound button[aria-pressed="true"] { color: var(--phosphor); border-color: var(--dim); }
.sound button:hover, .sound button:focus-visible { outline: none; color: var(--glass); background: var(--phosphor); }
@media (max-width: 520px) {
  body { font-size: 20px; padding-block: 12px; }
  .screen { padding: 16px 14px 20px; }
  .law thead { display: none; }
  .law, .law tbody, .law tr, .law td { display: block; width: 100%; }
  .law tr { padding: 8px 0; border-bottom: 1px dashed var(--rule); }
  .law td { border: 0; padding: 2px 0; }
  .law td:first-child { color: var(--hot); min-width: 0; }
  .law td[data-col]::before { content: attr(data-col) ": "; color: var(--dim); }
}
.flame { color: var(--hot); animation: flicker 1.3s steps(2) infinite; }
.flame.b { animation-delay: .45s; }
@keyframes flicker { 50% { color: var(--blood); opacity: .7; } }
.scene { color: var(--dim); }
.scene .hot { color: var(--hot); }
.shimmer { color: var(--phosphor); animation: shimmer 2.4s ease-in-out infinite; }
@keyframes shimmer { 50% { color: var(--dim); } }
.rules { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.rules li { display: grid; grid-template-columns: 6.5em 1fr; gap: 12px; }
.verdict { font-size: 27px; color: var(--hot); border-top: 1px dashed var(--dim); border-bottom: 1px dashed var(--dim); padding: 8px 0; }
.rules .who { color: var(--hot); letter-spacing: .06em; }
@media (max-width: 520px) { .rules li { grid-template-columns: 1fr; gap: 0; } }
@media (prefers-reduced-motion: reduce) { .cursor, .flame, .shimmer { animation: none; } }
</style>
</head>
<body>
<p class="sr-only" id="live" aria-live="polite"></p>
<div class="monitor"><main class="screen" id="screen"></main>
  <div class="sound" role="group" aria-label="Sound">
    <button type="button" id="sound-sfx" aria-pressed="true"></button>
    <button type="button" id="sound-music" aria-pressed="false"></button>
  </div></div>

<!-- Written by build.py from the pack (content.yaml) + the captured lesson SQL. Do not edit here. -->
<script id="quest-data" type="application/json">__QUEST_DATA__</script>
<script id="classic-art" type="application/json">__CLASSIC_ART__</script>
<script>
const QUEST = JSON.parse(document.getElementById("quest-data").textContent);
const REALMS = QUEST.realms;
const SAVE_KEY = QUEST.pack.storage_key;  // saves are <key>-progress and <key>-sound

// The pack's ASCII art (art/classic/*.txt), written in by build.py: title, guide, compiler, foe
// (the lexicon's roles), crown, banner, map, and scene_<realm id> for each realm that has a scene.
const ART = JSON.parse(document.getElementById("classic-art").textContent);
const MAP_ROWS = ART.map.split("\n");

// The pack's wording (strings.yaml). S() is plain text; H() is HTML: the text escaped, then
// *word* highlighted, **word** bold and [text](https://…) linked, then {name} filled in escaped.
const STRINGS = QUEST.pack.strings;
const fill = (t, v) => t.replace(/\{(\w+)\}/g, (m, k) => (Object.prototype.hasOwnProperty.call(v, k) ? String(v[k]) : m));
const S = (k, v = {}) => fill(STRINGS[k], v);
const H = (k, v = {}) => fill(esc(STRINGS[k]).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
  .replace(/\*(.+?)\*/g, '<span class="hot">$1</span>')
  .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2">$1</a>'),
  Object.fromEntries(Object.entries(v).map(([k, x]) => [k, esc(x)])));

// The throne room for a hall: pillars with torches, the hall's banner, the throne, and
// petitioners. During petitions one petitioner stands before the throne.
function hallScene(title, petitioning) {
  const W = 50, pad = s => s.padEnd(W);
  const banner = title.toUpperCase();
  const inner = 33, lp = Math.max(0, Math.floor((inner - banner.length) / 2));
  const row = (left, mid, right) => left + mid.padEnd(W - left.length - right.length) + right;
  const crowd = petitioning
    ? ["      o   o                o       o   o",
       "     /|\\ /|\\     o        /|\\     /|\\ /|\\",
       "     / \\ / \\    /|\\       / \\     / \\ / \\",
       "                / \\  " + S("hall_steps_forward")]
    : ["      o   o    o      o      o    o   o",
       "     /|\\ /|\\  /|\\    /|\\    /|\\  /|\\ /|\\",
       "     / \\ / \\  / \\    / \\    / \\  / \\ / \\"];
  const lines = [
    row(" )\uE000(", "   .---------------------------------.", " )\uE001( "),
    row(" |#|", "   |" + (" ".repeat(lp) + banner).padEnd(inner) + "|", " |#| "),
    row(" |#|", "   '---------------------------------'", " |#| "),
    row(" |#|", "        ||        _/^\\_        ||", " |#| "),
    row(" |#|", "        ||       |  \uE002  |       ||", " |#| "),
    row(" |#|", "        ||      _|_____|_      ||", " |#| "),
    row(" |#|", "        ||     |_________|     ||", " |#| "),
    "_|#|_" + "_".repeat(W - 10) + "_|#|_",
    ...crowd.map(pad)
  ];
  return `<pre class="art scene" style="--cols:${W}" aria-hidden="true">${lines.map(l => esc(l)
    // Private-use markers, so no letter in a hall's name can turn into a torch or a crown.
    .replace("\uE000", '<span class="flame">*</span>').replace("\uE001", '<span class="flame b">*</span>')
    .replace("\uE002", '<span class="hot crown">W</span>')).join("\n")}</pre>`;  // one cell wide, unlike ♛
}

// A realm's scene: its art with the realm's name on a banner. Markers apply to the art only,
// never to the banner, so no letter in a name can become a lantern.
function realmScene(r) {
  const scene = ART[`scene_${r.id}`];
  if (!scene) return art("banner", "hot");
  const lines = scene.split("\n");
  const art_ = lines.filter(l => l !== "@BANNER").map(l => l.replace(/^!/, ""));
  const name = r.name.toUpperCase(), inner = name.length + 6;
  const W = Math.max(inner + 2, ...art_.map(l => l.length));
  const off = " ".repeat(Math.floor((W - inner - 2) / 2));
  const banner = [off + "." + "-".repeat(inner) + ".", off + "|   " + name + "   |", off + "'" + "-".repeat(inner) + "'"];
  const out = lines.flatMap(l => l === "@BANNER" ? banner.map(b => esc(b))
    : [l.startsWith("!") ? `<span class="shimmer">${esc(l.slice(1))}</span>`
       : esc(l).replace(/\$/g, '<span class="flame">*</span>').replace(/%/g, '<span class="flame b">*</span>')]);
  return `<pre class="art scene" style="--cols:${W}" aria-hidden="true">${out.join("\n")}</pre>`;
}

const MAP = (() => {
  const w = Math.max(...MAP_ROWS.map(r => r.length));
  const edge = "+" + "-".repeat(w + 2) + "+";
  return [edge, ...MAP_ROWS.map(r => "| " + r.padEnd(w) + " |"), edge].join("\n");
})();

// ---- Sound: generated with the Web Audio API, so there are no audio files and no requests. ----
// Effects are on by default, music is off; both toggles are remembered. Browsers only allow
// audio after the player clicks or presses a key, so nothing plays before that.
const Sound = (() => {
  const AC = typeof AudioContext !== "undefined" ? AudioContext
    : typeof webkitAudioContext !== "undefined" ? webkitAudioContext : null;
  const prefs = { sfx: true, music: false };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(`${SAVE_KEY}-sound`) || "{}")); } catch {}
  const save = () => { try { localStorage.setItem(`${SAVE_KEY}-sound`, JSON.stringify(prefs)); } catch {} };
  let ctx = null, master = null, musicBus = null, unlocked = false;
  let track = null, want = null, timer = null, lead = { i: 0, t: 0 }, bass = { i: 0, t: 0 };
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);          // MIDI note number to frequency

  let broken = false;                                        // audio failed once: stay silent
  function ensure() {
    if (!AC || !unlocked || broken) return false;
    try {
      if (!ctx) {
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = 0.16; master.connect(ctx.destination);
        musicBus = ctx.createGain(); musicBus.gain.value = 0.45; musicBus.connect(master);
      }
      if (ctx.state === "suspended") ctx.resume();
      return true;
    } catch { broken = true; return false; }
  }
  function tone(freq, at, dur, type = "square", vol = 0.5, dest = master, slideTo = 0) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, at);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, at + dur);
    g.gain.setValueAtTime(vol, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(dest);
    o.start(at); o.stop(at + dur + 0.02);
  }
  const EFFECTS = {
    coin: t => { tone(hz(83), t, 0.07); tone(hz(88), t + 0.07, 0.25); },                 // gold
    steal: t => { [88, 83, 79, 76].forEach((n, i) => tone(hz(n), t + i * 0.06, 0.07, "square", 0.3));  // coins tumbling away
                  tone(130, t + 0.26, 0.3, "sawtooth", 0.35, master, 65); },
    magic: t => [84, 88, 91, 96, 91, 96].forEach((n, i) => tone(hz(n), t + i * 0.05, 0.18, "triangle", 0.35)),
    fanfare: t => [72, 76, 79, 84].forEach((n, i) => tone(hz(n), t + i * 0.11, i === 3 ? 0.5 : 0.12)),
    blip: t => tone(hz(81), t, 0.045, "square", 0.2)
  };
  // Original loops, written for this game: [MIDI note or 0 for a rest, beats].
  const TRACKS = {
    map: { bpm: 96,
      lead: [[72,1],[76,1],[79,1],[76,1],[77,1],[74,1],[71,2],[72,1],[74,1],[76,1],[79,1],[77,2],[74,2]],
      bass: [[48,2],[55,2],[53,2],[55,2],[48,2],[52,2],[53,2],[55,2]] },
    court: { bpm: 80,
      lead: [[74,2],[77,1],[76,1],[74,2],[69,2],[70,2],[72,1],[70,1],[69,4]],
      bass: [[50,4],[46,4],[43,4],[45,4]] },
    battle: { bpm: 132,
      lead: [[69,.5],[72,.5],[76,.5],[72,.5],[69,.5],[72,.5],[77,.5],[72,.5],[67,.5],[71,.5],[74,.5],[71,.5],[68,.5],[71,.5],[76,1]],
      bass: [[45,1],[45,1],[41,1],[41,1],[43,1],[43,1],[40,1],[40,1]] }
  };
  function voice(part, notes, spb, type, vol) {
    while (part.t < ctx.currentTime + 0.25) {
      const [n, beats] = notes[part.i % notes.length];
      if (n) tone(hz(n), part.t, beats * spb * 0.85, type, vol, musicBus);
      part.t += beats * spb; part.i++;
    }
  }
  function stopMusic() { clearInterval(timer); timer = null; track = null; }
  function startMusic(name) {
    if (!prefs.music || !name || !ensure() || document.hidden) return stopMusic();
    if (track === name && timer) return;
    stopMusic();
    track = name;
    const tr = TRACKS[name], spb = 60 / tr.bpm, t0 = ctx.currentTime + 0.05;
    lead = { i: 0, t: t0 }; bass = { i: 0, t: t0 };
    const tick = () => { voice(lead, tr.lead, spb, "square", 0.22); voice(bass, tr.bass, spb, "triangle", 0.5); };
    tick(); timer = setInterval(tick, 100);
  }
  function label() {
    const fx = document.getElementById("sound-sfx"), mu = document.getElementById("sound-music");
    if (!fx || !mu || !fx.setAttribute) return;
    fx.textContent = S("sound_sfx", { state: S(prefs.sfx ? "sound_on" : "sound_off") });
    mu.textContent = S("sound_music", { state: S(prefs.music ? "sound_on" : "sound_off") });
    fx.setAttribute("aria-pressed", String(prefs.sfx));
    mu.setAttribute("aria-pressed", String(prefs.music));
  }
  return {
    prefs,
    unlock() { unlocked = true; try { startMusic(want); } catch { broken = true; } },
    play(name) { try { if (prefs.sfx && ensure()) EFFECTS[name](ctx.currentTime + 0.01); } catch { broken = true; } },
    music(name) { want = name; try { startMusic(name); } catch { broken = true; } },
    toggle(which) {
      prefs[which] = !prefs[which]; save(); label();
      if (which === "music") startMusic(want);
      else if (prefs.sfx) this.play("blip");
    },
    pause() { stopMusic(); },
    resume() { startMusic(want); },
    label
  };
})();

// ---- Gold: right answers earn it, wrong ones cost some, magic is free. -------------------------
const GOLD_WIN = 10, GOLD_LOSS = 5;
const LEGEND = () => `<div class="legend" aria-label="${esc(S("legend_label"))}">
  <span>${H("legend_guide")}</span><span>${H("legend_scroll")}</span>
  <span>${H("legend_compiler")}</span><span>${H("legend_foe")}</span></div>`;
const RULE = () => `<div class="rule-card"><span class="hot">${H("rule_title")}</span>
  <p>${H("rule_text")}</p></div>`;
const GOLD_RULES = () => S("gold_rules", { win: GOLD_WIN, loss: GOLD_LOSS });

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bar = (n, max, on, off) => `<span class="bar">${on.repeat(n)}<span class="gone">${off.repeat(max - n)}</span></span>`;
const cols = t => Math.max(...String(t).split("\n").map(l => l.length));
const art = (k, cls = "") => `<pre class="art ${cls}" style="--cols:${cols(ART[k])}" aria-hidden="true">${esc(ART[k])}</pre>`;
const isOn = (hl, i) => hl === "all" || hl.includes(i);

// Most gold a realm can give: every question answered right first time.
const questionsIn = r => r.halls.reduce((n, h) => n + h.trials.length, 0) + r.encounters.reduce((n, e) => n + 1 + e.points.length, 0);
const maxGold = r => questionsIn(r) * GOLD_WIN;
const OPEN = REALMS.filter(r => !r.sealed);
const COURSE_MAX = OPEN.reduce((n, r) => n + maxGold(r), 0);

// Progress per realm: { done, best }. Older saves stored `true`; read those as done with 0 gold.
// Saves come from the player's browser, so treat them as untrusted: only known realms, `best` as a
// whole number between 0 and the realm's maximum. Older saves stored `true`: done with 0 gold.
function loadProgress() {
  let raw = {};
  try { raw = JSON.parse(localStorage.getItem(`${SAVE_KEY}-progress`) || "{}") || {}; } catch { return {}; }
  const out = {};
  for (const r of REALMS) {
    const v = raw[r.id];
    if (v === true) out[r.id] = { done: true, best: 0 };
    else if (v && typeof v === "object") {
      const b = Math.floor(Number(v.best));
      out[r.id] = { done: !!v.done, best: Number.isFinite(b) ? Math.max(0, Math.min(b, maxGold(r))) : 0 };
    }
  }
  return out;
}
function finishRealm(id, gold) {
  const p = loadProgress(), prev = p[id] || { done: false, best: 0 };
  const record = gold > prev.best;
  p[id] = { done: true, best: Math.max(prev.best, gold) };
  try { localStorage.setItem(`${SAVE_KEY}-progress`, JSON.stringify(p)); } catch {}
  return record;
}
const treasury = () => Object.entries(loadProgress()).reduce((n, [id, v]) => n + (OPEN.some(r => r.id === id) ? v.best : 0), 0);
const courseDone = () => { const p = loadProgress(); return OPEN.every(r => p[r.id] && p[r.id].done); };

let state;
let actions = [];
const fresh = () => ({ screen: "title", realm: 0, hall: 0, enc: 0, step: 0, gold: 0, flash: null });
const realm = () => REALMS[state.realm];
const hall = () => realm().halls[state.hall];
const encounter = () => realm().encounters[state.enc];
const firstDone = () => !!(loadProgress()[REALMS[0].id] || {}).done || !!state.firstDone;

function choices(list) {
  actions = list.map(c => c.go);
  return `<ul class="choices">${list.map((c, i) =>
    `<li><button type="button" id="choice-${i}" data-i="${i}"><span class="key">[${i + 1}]</span> ${esc(c.label)}</button></li>`
  ).join("")}</ul>`;
}

function code(lines, hl, cls, label) {
  return `<div class="sr-only">${esc(label)}:</div><pre class="scroll">${lines.map((l, i) =>
    `<span class="ln ${cls}${isOn(hl, i) ? " on" : ""}">${isOn(hl, i) ? `<span class="sr-only">${H("sr_highlighted")} </span>` : ""}${esc(l)}</span>`).join("")}</pre>`;
}

function cell(c) {
  const at = c.indexOf(S("soon_marker")), mark = S("soon_marker");  // styled wherever a cell says it
  const m = mark && at >= 0 ? [c, c.slice(0, at), mark, c.slice(at + mark.length)] : null;
  return m ? `${esc(m[1])}<span class="soon">${esc(m[2])}</span>${esc(m[3])}` : esc(c);
}
function table(columns, rows) {
  return `<div class="law-wrap"><table class="law"><thead><tr><th></th>${columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(row => `<tr><td>${esc(row.label)}</td>${row.cells.map((c, i) =>
      `<td data-col="${esc(columns[i] || "")}">${cell(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

// Every pane, in the pack's order; the first is the guide's (the AI's scroll).
function panes(e, p) {
  return e.panes.map((pane, i) => `<div class="pane"><span class="lbl">${esc(pane.label)}</span>${code(pane.lines, p.highlights[pane.id], i === 0 ? "agent" : "", pane.name)}${
    pane.caption ? `\n    <span class="cap">${esc(pane.caption)}</span>` : ""}</div>`).join("\n    ");
}

// One answer. Right: +gold, move on. Wrong: lose gold (never below 0), answer again.
// Blocked (a path closed in this realm): nothing changes, choose again. Magic: shown, no gold.
function answer(kind) {
  if (kind === "win") { state.gold += GOLD_WIN; Sound.play("coin"); state.flash = { kind, amount: GOLD_WIN }; }
  else if (kind === "loss") {
    const taken = Math.min(GOLD_LOSS, state.gold);
    state.gold -= taken; Sound.play("steal"); state.flash = { kind, amount: taken };
  } else { Sound.play("blip"); state.flash = { kind, amount: 0 }; }
  render();
}
function magic() { Sound.play("magic"); state.flash = { kind: "magic", amount: 0 }; render(); }
const MAGIC_LABEL = () => S("magic_label");
const settled = f => f.kind === "win" || f.kind === "magic";

function announce(t) { const el = document.getElementById("live"); if (el) el.textContent = t; }

function feedback(f, why, hint, correctText, court = false) {
  announce(f.kind === "win" ? S("said_win", { amount: f.amount, why }) : f.kind === "magic" ? S("said_magic", { answer: correctText, why })
           : f.kind === "blocked" ? S("said_blocked", { hint }) : S("said_miss", { hint }));
  if (f.kind === "win") return `<div class="feedback"><span class="tag">${H("won_tag", { amount: f.amount })}</span><p>${esc(why)}</p></div>`;
  if (f.kind === "magic") return `<div class="feedback magic"><span class="tag">${H("magic_tag")}</span>
    <p>${H("magic_answer", { answer: correctText })}</p><p>${esc(why)}</p></div>`;
  if (f.kind === "blocked") return `<div class="feedback magic"><span class="tag">${H("blocked_tag")}</span><p>${esc(hint)}</p></div>`;
  const took = f.amount ? H(court ? "fine_court" : "fine_foe", { amount: f.amount }) : H(court ? "empty_court" : "empty_foe");
  return `<div class="feedback miss"><span class="tag">${took}</span><p>${esc(hint)}</p></div>`;
}

const meta = r => S("realm_meta", { depth: r.depth, minutes: r.minutes });
const go = patch => () => { Sound.play("blip"); Object.assign(state, patch); render(); };
const toMap = go({ screen: "map", flash: null });
const goldTag = () => `<span><span class="lbl">${H("gold_tag")}</span> <span class="hot">${state.gold}</span></span>`;

const SCREENS = {
  title() {
    return `<h1 class="sr-only">${esc(QUEST.pack.title)}</h1>${art("title", "hot")}
      <p>${H("title_intro")}</p>
      <p class="dim">${H("title_start")}</p>
      ${choices([{ label: S("title_open"), go: toMap }])}
      <p class="foot">${H("title_keys")} <span class="cursor">&nbsp;</span><br>
        ${H("title_links")}</p>`;
  },
  map() {
    const done = loadProgress();
    const names = Object.fromEntries(REALMS.map(r => [r.id, r.name.replace(/^The /, "")]));
    const routes = QUEST.routes.map(rt => `<span><b>${esc(rt.who)}:</b> ${rt.path.map(id => esc(names[id] || id)).join(" → ")}</span>`).join("");
    const purse = courseDone()
      ? `<p class="hot">${H("course_complete", { score: treasury(), max: COURSE_MAX })}</p>`
      : `<p><span class="lbl">${H("treasury_label")}</span> <span class="hot">${treasury()}</span> <span class="dim">${H("treasury_of", { max: COURSE_MAX })}</span></p>`;
    return `<h2>${H("map_title")}</h2>
      <pre class="art" style="--cols:${cols(MAP)}" aria-hidden="true">${esc(MAP)}</pre>
      ${purse}
      <div class="routes"><span>${H("routes_intro")}</span>${routes}</div>
      ${choices(REALMS.map((r, i) => {
        const d = done[r.id];
        const mark = d && d.done ? S("mark_best", { best: d.best, max: maxGold(r) }) : r.sealed ? S("mark_sealed")
          : i === 0 ? S("mark_start") : !firstDone() ? S("mark_after_first") : "";
        return { label: S("map_entry", { name: r.name, meta: meta(r), mark }), go: go({ screen: "realm", realm: i, flash: null }) };
      }))}`;
  },
  realm() {
    const r = realm();
    const head = `${r.halls.length ? art("crown") : realmScene(r)}<h2>${esc(r.name)}</h2><p class="realm-meta">${esc(meta(r))}</p><p>${esc(r.covers)}</p>`;
    if (r.sealed) return `${head}<p class="dim">${H("realm_sealed")}</p>
      ${choices([{ label: S("back_to_map"), go: toMap }])}`;
    if (state.realm !== 0 && !firstDone()) return `${head}<p class="dim">${H("realm_locked", { first: REALMS[0].name })}</p>
      ${choices([{ label: S("travel_to", { first: REALMS[0].name }), go: go({ screen: "realm", realm: 0 }) }, { label: S("back_to_map"), go: toMap }])}`;
    const enter = r.halls.length ? go({ screen: "hall", hall: 0, step: 0, gold: 0, flash: null })
                                 : go({ screen: "quest", enc: 0, step: 0, gold: 0, flash: null });
    return `${head}<p class="dim">${H("realm_max", { max: maxGold(r) })}</p>
      ${choices([{ label: S(r.halls.length ? "enter_halls" : "take_quest"), go: enter }, { label: S("back_to_map"), go: toMap }])}`;
  },

  // ---- A realm of halls: one idea per hall, then its questions ---------------------------------
  hall() {
    const r = realm(), h = hall();
    return `<div class="status"><span class="lbl">${H("hall_of", { n: state.hall + 1, total: r.halls.length })}</span>${goldTag()}</div>
      ${hallScene(h.title, false)}
      <h2>${esc(h.title)}</h2>
      ${h.teach.map(t => `<p>${esc(t)}</p>`).join("")}
      ${h.rows.length ? table(h.columns, h.rows) : ""}
      ${choices([{ label: S("hear_petitions", { n: h.trials.length }), go: go({ screen: "trials", step: 0, flash: null }) }, { label: S("back_to_map"), go: toMap }])}`;
  },
  trials() {
    const r = realm(), h = hall(), t = h.trials[state.step];
    const head = `<div class="status"><span class="lbl">${esc(h.title.toUpperCase())}</span>${goldTag()}
      <span><span class="lbl">${H("petition_label")}</span> ${state.step + 1}/${h.trials.length}</span></div>`;
    const intro = t.kind === "claim" ? H("intro_claim") : H("intro_choice");
    if (state.flash) {
      const f = state.flash, lastInHall = state.step + 1 >= h.trials.length, lastHall = state.hall + 1 >= r.halls.length;
      const next = !settled(f) ? S("judge_again") : !lastInHall ? S("next_petitioner") : lastHall ? S("hear_decree") : S("on_to_hall", { n: state.hall + 2 });
      return `${head}${hallScene(h.title, true)}<p class="hot">${esc(t.text)}</p>
        ${feedback(f, t.why, S("court_hint"), t.options[t.correct], true)}
        ${choices([{ label: next, go: () => {
          if (settled(f)) {
            if (!lastInHall) state.step++;
            else if (lastHall) state.screen = "decree";
            else { state.hall++; state.step = 0; state.screen = "hall"; }
          }
          state.flash = null; render();
        } }])}`;
    }
    return `${head}${hallScene(h.title, true)}<p>${intro}</p><p class="hot">${esc(t.text)}</p>
      ${choices([...t.options.map((o, i) => ({ label: o, go: () => answer(i === t.correct ? "win" : "loss") })), { label: MAGIC_LABEL(), go: magic }])}`;
  },
  decree() {
    const r = realm();
    const record = finishRealm(r.id, state.gold); state.firstDone = state.firstDone || state.realm === 0;
    Sound.play("fanfare");
    return `${art("crown", "hot")}<h2>${H("decree_title")}</h2>
      <p>${H("decree_carry", { gold: state.gold, max: maxGold(r), realm: r.name, record: record ? S("record_best") : "" })}</p>
      ${r.decree.map((d, i) => `<p>${i + 1}. ${esc(d)}</p>`).join("")}
      <p class="dim">${H("scroll_recap")}</p>
      ${r.scroll ? table(r.scroll.columns, r.scroll.rows) : ""}
      <p class="dim">${H("roads_open")}</p>
      ${choices([{ label: S("back_to_map"), go: toMap }])}`;
  },

  // ---- Every other realm: one quest -----------------------------------------------------------
  quest() {
    const r = realm(), e = encounter(), p = e.path;
    const head = `<div class="status"><span class="lbl">${esc(r.name.toUpperCase())}</span>${goldTag()}</div>`;
    const body = `${realmScene(r)}<p>${H("quest_intro")}</p><p class="hot">"${esc(e.quest)}"</p>
      <p>${H("read_intent")}</p>`;
    if (state.flash) {
      const f = state.flash, chosen = state.choice ?? p.correct;
      const text = f.kind === "magic" ? p.outcomes[p.correct].why : p.outcomes[chosen].why;
      return `${head}${body}${feedback(f, text, text, p.options[p.correct])}
        ${choices([{ label: S(settled(f) ? "watch_guide" : "choose_again"), go: () => {
          if (settled(f)) state.screen = "guide";
          state.flash = null; render();
        } }])}`;
    }
    return `${head}${body}
      ${choices([...p.options.map((o, i) => ({ label: o, go: () => { state.choice = i; answer(p.outcomes[i].kind); } })), { label: MAGIC_LABEL(), go: magic }])}`;
  },
  guide() {
    const e = encounter();
    return `<div class="status"><span class="lbl">${H("path_label")}</span>${goldTag()}</div>${art("guide")}
      <p>${H("guide_text")}</p>
      ${code(e.panes[0].lines, [], "agent", e.panes[0].name)}
      ${choices([{ label: S("carry_scroll"), go: go({ screen: "compiler" }) }])}`;
  },
  compiler() {
    const e = encounter();
    return `${art("compiler")}
      <p>${H("compiler_text")}</p>
      ${LEGEND()}${RULE()}
      <p class="dim">${H("foe_points", { n: e.points.length, gold_rules: GOLD_RULES() })}</p>
      ${choices([{ label: S("draw_weapon"), go: go({ screen: "battle", step: 0, flash: null }) }])}`;
  },
  battle() {
    const e = encounter(), q = e.points[state.step];
    const head = `<div class="status">${goldTag()}
      <span><span class="lbl">${H("foe_label")}</span> ${bar(e.points.length - state.step, e.points.length, "█", "░")}</span></div>${LEGEND()}`;
    if (state.flash) {
      const f = state.flash, last = state.step + 1 >= e.points.length;
      return `${head}${panes(e, q)}
        ${feedback(f, q.why, q.hint, q.options[q.correct])}
        ${choices([{ label: S(!settled(f) ? "try_again" : last ? "foe_falls" : "next_point"), go: () => {
          if (settled(f)) { state.step++; if (state.step >= e.points.length) state.screen = "victory"; }
          state.flash = null; render();
        } }])}`;
    }
    return `${head}${state.step === 0 ? art("foe") : ""}${panes(e, q)}
      <p>${esc(q.ask)}</p>
      ${choices([...q.options.map((o, i) => ({ label: o, go: () => answer(i === q.correct ? "win" : "loss") })), { label: MAGIC_LABEL(), go: magic }])}`;
  },
  victory() {
    const r = realm(), e = encounter();
    const record = finishRealm(r.id, state.gold);
    Sound.play("fanfare");
    const TAGS = QUEST.pack.rule_tags, group = p => p.rule && TAGS[p.ruleTag] ? TAGS[p.ruleTag].group : "";
    const item = p => `<li><span class="who">${esc(TAGS[p.ruleTag].label)}</span><span>${esc(p.rule)}</span></li>`;
    const rules = e.points.filter(p => group(p) === "rules");
    const yours = e.points.filter(p => group(p) === "yours");
    return `${realmScene(r)}<h2>${H("victory_title")}</h2>
      <p>${H("carry_home", { gold: state.gold, max: maxGold(r), record: record ? S("record_best") : "" })}</p>
      <p class="lbl">${H("rules_heading")}</p>
      <p class="dim">${H("rules_note")}</p>
      <ul class="rules">${rules.map(item).join("")}</ul>
      ${yours.length ? `<p class="lbl">${H("yours_heading")}</p><ul class="rules">${yours.map(item).join("")}</ul>` : ""}
      <p class="verdict">${H("verdict")}</p>
      <p>${esc(e.takeaway)}</p>
      ${choices([{ label: S("back_to_map"), go: toMap }, { label: S("quest_again"), go: go({ screen: "quest", enc: 0, step: 0, gold: 0, flash: null }) }])}`;
  }
};

const MUSIC_FOR = { hall: "court", trials: "court", decree: "court", quest: "battle", guide: "battle",
                    compiler: "battle", battle: "battle", victory: "battle" };

function render() {
  const el = document.getElementById("screen");
  el.innerHTML = SCREENS[state.screen]();
  Sound.music(MUSIC_FOR[state.screen] || "map");
  el.querySelector(".choices button")?.focus({ preventScroll: true });
}

document.addEventListener("click", e => {
  Sound.unlock();
  if (e.target.closest("#sound-sfx")) return Sound.toggle("sfx");
  if (e.target.closest("#sound-music")) return Sound.toggle("music");
  const b = e.target.closest(".choices button");
  if (b) actions[+b.dataset.i]?.();
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;   // holding a key must not skip explanations
  Sound.unlock();
  const k = (e.key || "").toLowerCase();
  if (k === "s") { e.preventDefault(); return Sound.toggle("sfx"); }
  if (k === "m") { e.preventDefault(); return Sound.toggle("music"); }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= actions.length) { e.preventDefault(); actions[n - 1](); }
});

document.addEventListener("visibilitychange", () => (document.hidden ? Sound.pause() : Sound.resume()));

state = fresh();
Sound.label();
render();
</script>
</body>
</html>
