# AgentQL Quest: the realm map, and what the game adds on top of the course.
#
# Every player starts in the Kingdom of Law (Module 0, the foundation): four short halls, each
# teaching one idea and testing it straight away. Every other realm is one quest, a couple of
# minutes long, that practises what Law taught and then goes deeper:
#   1. the merchant's business question
#   2. read the intent: which path, Keyword Search, AgentQL or Code Complete?
#   3. the Wizard (the AI) writes the AgentQL
#   4. the dragon: the SQL ThoughtSpot compiled. Most scales are rules that ThoughtSpot or the
#      Model added; one may be the part only your AgentQL asked for
#   5. the hoard: gold, and the rules you uncovered
#
# The SQL is never written here. `build.py` reads the AgentQL and the generated warehouse SQL
# for each encounter's `case` from references/lesson-sql.md (the committed capture of
# `tools/agentql-retest --suite lessons guards`). This file holds only what the capture can't.
#
# Per dragon point:
#   sql:       whole SQL lines to highlight (indentation ignored). Each must still be in the
#              capture exactly, so a recapture that edits the line fails the build.
#   scroll:    substrings of the AgentQL lines to highlight. [] = nothing (itself a clue).
#   sql_count: {text: n} facts about the whole statement that one line can't pin down.
#   rule:      the deterministic rule this scale shows, listed in the hoard when it breaks.
#   rule_by:   who adds that rule (model | thoughtspot), or agentql for the player's own part,
#              or determinism for the conclusion. A who point takes it from its answer.
#   '*' in sql/scroll highlights everything.
#
# The build fails (offline, no cluster) when:
#   - a realm's module, or any lesson ("lesson 3.4") or Module the text names, is no longer
#     in learning-path.md; or an encounter's `lesson` doesn't list its case under Guarded by,
#     or belongs to a different module than its realm
#   - a `case` is missing from the capture, or was not SUCCESS
#   - `agentql` differs from the captured AgentQL by anything but layout
#   - an `sql` line, `scroll` substring or `sql_count` no longer holds

# Each lesson the text names, with a word its heading must contain: a renumbered or retitled
# course fails the build instead of pointing players at the wrong lesson.
lesson_titles:
  "2.3": Filters
  "3.3": Security
  "3.4": Every product
  "5.1": CTE
  "5.2": Window functions

# The three answers offered for every `who` point. `model` and `thoughtspot` answers both
# map to the Forge option; the lesson text says which it was.
who_options:
  forge: "The Forge: ThoughtSpot added it"
  agentql: "Your scroll: it's in the AgentQL"
  ai: "The Wizard: the AI made it up"

# The engines Spotter can choose between. Unreleased capabilities are left out, except the two
# the product team has confirmed for the near term (keyword review and pinning for AgentQL),
# which the game labels "coming soon".
engines:
  keyword: Keyword Search
  agentql: AgentQL
  code_complete: Code Complete

# Suggested routes, shown on the map. Advice, not gates.
routes:
  - who: Just the essentials
    path: [law]
  - who: Reading the SQL
    path: [law, mines, lake, forests]
  - who: Everything
    path: [law, mines, lake, forests, isles]

realms:
  - id: law
    name: The Elven Kingdom of Law
    module: 0
    depth: Overview
    minutes: 4
    covers: >-
      The foundation. How AgentQL sits with Keyword Search, and where Code Complete takes
      over: who writes the query, how a person checks it, and why the answer stays governed.
    source: learning-path.md Module 0; Code Complete from ThoughtSpot's public Spotter summary
    # The whole comparison, shown once at the end as a recap. Each hall teaches a slice of it.
    scroll:
      columns: [Keyword Search, AgentQL, Code Complete]
      rows:
        - label: Best for
          cells: ["Straightforward questions, with fast and predictable answers",
                  "More complex questions that need greater expressibility",
                  "Analysis beyond SQL, after the database query has run"]
        - label: Who writes the query
          cells: ["A person, in natural language turned into keywords", "An AI agent, in AgentQL",
                  "Spotter adds code that works on the results of a Keyword Search or AgentQL query"]
        - label: What it can express
          cells: ["Filtering, pivoting, drill-down, calendars, governed metrics",
                  "All of that, plus multi-stage analysis, complex expressions and outer joins",
                  "Forecasting, statistical analysis, custom calculations, and tools such as Slack or Google Sheets"]
        - label: How a person checks it
          cells: ["Read the keywords. No SQL to read.",
                  "Coming soon: the agent's query shown as keywords, so a person checks it the same way",
                  "It starts from a Keyword Search or AgentQL result"]
        - label: How it runs
          cells: ["The governed engine compiles it into warehouse SQL", "The same engine and the same compile step",
                  "Its code runs on the returned data. Every database query stays governed and secure."]
        - label: Where the answer lives
          cells: ["A ThoughtSpot Answer: explore it, verify it with keywords, pin it to a Liveboard",
                  "An answer in the Spotter conversation. Coming soon: pin it to a Liveboard",
                  "Spotter Canvas only. It can't be pinned to a Liveboard."]
    halls:
      - title: The Hall of Two Paths
        teach:
          - ThoughtSpot has two ways to create a query over the same governed Model.
          - A person uses Keyword Search, and their words become keywords. An AI agent writes AgentQL, which can express more.
        columns: [Keyword Search, AgentQL]
        rows: [Best for, Who writes the query]
        trials:
          - kind: route
            petition: '"Show me total sales by region for last quarter."'
            answer: keyword
            why: >-
              Keyword Search. Filtering, governed metrics and calendars are what keywords do
              well, with the most predictable answer.
          - kind: route
            petition: '"Show me every product with its West sales, including products never sold in the West."'
            answer: agentql
            why: >-
              AgentQL. Keeping every product, matched or not, takes an outer join, which
              keywords can't express.
      - title: The Hall of Checking
        teach:
          - With Keyword Search, a person checks the query by reading the keywords. No SQL to read.
          - The same keyword review for AgentQL is the planned solution, coming soon. The more an agent can express, the more it has to get right, which is why checking matters.
        columns: [Keyword Search, AgentQL]
        rows: [How a person checks it, What it can express]
        trials:
          - kind: claim
            claim: '"Soon, AgentQL answers will be checked with keywords too, the same way as a keyword search."'
            truth: true
            why: >-
              True. Keyword review for AgentQL is the planned solution, coming soon, so a person
              will confirm the agent's intent without reading any SQL.
          - kind: claim
            claim: '"If the query compiles and runs, the number must be right."'
            truth: false
            why: >-
              False. Valid SQL is not proof of correct business logic. A query can compile, run
              and return a confident wrong number, which is why a person checks the intent.
      - title: The Hall of the Forge
        teach:
          - ThoughtSpot never executes AgentQL. It compiles it into warehouse SQL, on the same governed engine keyword search uses.
          - You query the Model, not the tables, so the Model's joins, formulas and security rules go into the SQL ThoughtSpot writes.
        columns: [Keyword Search, AgentQL]
        rows: [How it runs]
        trials:
          - kind: claim
            claim: '"The AI writes SQL and runs it straight against our warehouse."'
            truth: false
            why: >-
              False. ThoughtSpot never executes AgentQL. It compiles the AgentQL into warehouse
              SQL against the Model, and only that SQL runs.
          - kind: claim
            claim: '"The joins and formulas come from the Model, so they are the same whoever, or whatever, writes the query."'
            truth: true
            why: >-
              True. You query the Model, not the tables. Row-level security is the one part that
              differs by design: it filters each user's rows to what they may see.
      - title: The Hall of the Third Engine
        teach:
          - Some questions need analysis beyond SQL, such as a forecast or a statistical test. Spotter uses Code Complete for those.
          - Its code runs on the results of a governed query, and its answers live in Spotter Canvas.
        columns: [Code Complete]
        rows: [Best for, What it can express, Where the answer lives]
        trials:
          - kind: route
            petition: '"Forecast next quarter''s sales from the last two years."'
            answer: code_complete
            why: >-
              Code Complete. Forecasting needs code libraries that run after the database query.
              The sales history itself still comes from a governed Keyword Search or AgentQL query.
          - kind: claim
            claim: '"A Code Complete answer can be pinned to a Liveboard, like any other answer."'
            truth: false
            why: >-
              False. Keyword Search answers can be pinned, and pinning AgentQL answers is coming
              soon. Code Complete answers live in Spotter Canvas only and can't be pinned.
    decree:
      - ThoughtSpot never executes AgentQL. It compiles it into warehouse SQL.
      - You query the Model, not the tables, so the Model's joins, formulas and security rules go into the SQL.
      - A person checks a keyword search by its keywords, and the same review is coming soon for AgentQL. Valid SQL is not proof of the right answer.
      - Code Complete goes beyond SQL on the results that come back, and every database query stays governed.

  - id: mines
    name: The Dwarven Mines of Silver Ore
    module: 2
    depth: Reads SQL
    minutes: 2
    covers: >-
      The gentle start: a simple question, written in AgentQL, and the rules ThoughtSpot and
      the Model add to even the simplest SQL.
    encounters: [l2_filter_case_insensitive]

  - id: lake
    name: The Craftsmen of the Lake
    module: 3
    depth: Reads SQL
    minutes: 3
    covers: >-
      A question keywords can't ask. The Model still forges the joins and the security, and
      your AgentQL adds the one thing it couldn't: every product, sold or not.
    encounters: [l3_all_products_left_join]

  - id: forests
    name: The Golden Forests
    module: 5
    depth: Reads SQL
    minutes: 3
    covers: >-
      A question in two steps: total each store first, then average those totals. Your AgentQL
      builds the steps, and the Model still supplies the joins and the names.
    encounters: [l5_cte_two_step]

  - id: isles
    name: The Shifting Isles
    module: 5
    depth: Reads SQL
    minutes: 3
    covers: >-
      Ranking within each region, with a window function only AgentQL can write, compiled
      with the same null-safe, governed rules as everything else.
    encounters: [l5_rank]

encounters:
  # ---- Dwarven Mines: the simple introduction, with the keyword path blocked --------------------
  - case: l2_filter_case_insensitive
    lesson: "2.3"
    quest: What were sales in the West region?
    path:
      answer: agentql
      blocked:
        keyword: >-
          For a question this simple, Keyword Search would normally be the right path. But the
          keyword tunnel has caved in, so in these mines the Wizard must write it in AgentQL.
          Watch how the same rules still apply.
      why:
        agentql: >-
          AgentQL it is. With the keyword tunnel closed, the Wizard writes the question as
          AgentQL, typing "west" in lower case the way people often do.
        code_complete: >-
          Not Code Complete. That is for analysis beyond SQL, after the query. A total with a
          filter is the database's job.
    agentql: |
      SELECT SUM("t1"."sales") AS s
      FROM "(Sample) Retail - Apparel" AS "t1"
      WHERE "t1"."region" = 'west'
    points:
      - kind: who
        answer: model
        rule: Joins and their keys come from the Model
        sql:
          - 'JOIN "RETAILAPPAREL"."PUBLIC"."DIM_RETAPP_STORES" "ta_2"'
          - 'ON "ta_1"."STOREID" = "ta_2"."STOREID"'
        sql_count: {'JOIN "RETAILAPPAREL"': 1}
        scroll: ['FROM "(Sample) Retail - Apparel" AS "t1"']
        ask: >-
          Filtering on region brought in a join to the stores table, on STOREID. Your scroll
          never mentioned stores or keys. Who added the join?
        hint: Region lives in a different table from sales. Who knows how they connect?
        lesson: >-
          The Model. Region lives in the stores table, so filtering on it brings in that join,
          with the type and keys the Model defines.
      - kind: who
        answer: thoughtspot
        rule: Text filters are case-insensitive
        sql: ["WHERE LOWER(\"ta_2\".\"REGION\") = 'west'"]
        scroll: ["WHERE \"t1\".\"region\" = 'west'"]
        ask: >-
          Your scroll wrote 'west' in lower case, but the data says 'West'. The query still
          finds the West's sales. Who made them match?
        hint: Compare your WHERE with the SQL's WHERE. Something was wrapped around REGION.
        lesson: >-
          ThoughtSpot. Text = and IN always compile case-insensitively, with LOWER(), and there
          is no case-sensitive form.
      - kind: who
        answer: thoughtspot
        rule: This sum is null-safe, so an empty total is 0
        sql: ['WHEN sum("ta_1"."SALES") IS NOT NULL THEN sum("ta_1"."SALES")', 'ELSE 0']
        scroll: ['SUM("t1"."sales")']
        ask: >-
          The sum is wrapped in CASE WHEN ... IS NOT NULL ... ELSE 0. Your scroll has no null
          check. Who added it?
        hint: Look for a null check in your scroll. There isn't one.
        lesson: >-
          ThoughtSpot wraps this SUM in a null guard, so an empty total comes back as 0, not
          NULL.
      - kind: choice
        rule: The same AgentQL, Model and user always compile to the same SQL
        rule_by: determinism
        sql: ['*']
        scroll: ['*']
        ask: >-
          Final blow. The Wizard carries the exact same scroll to the Forge a second time.
          What SQL comes out?
        options:
          - text: Exactly the same SQL, line for line
            correct: true
          - text: Slightly different SQL, because AI is involved
          - text: It depends on the Wizard's mood
        hint: Where does the AI sit, before ThoughtSpot compiles the scroll or inside it?
        lesson: >-
          Same scroll, same Model, same user: same SQL. Compilation is deterministic. The AI's
          step is different: asked again, the Wizard might word the scroll differently, which
          is why a person checks what the agent asked.
    takeaway: >-
      One simple question. Every rule above came from the Model and ThoughtSpot, not from the
      AI, so this AgentQL compiles to exactly this SQL, every time.

  # ---- Craftsmen of the Lake: a question keywords can't ask -------------------------------------
  - case: l3_all_products_left_join
    lesson: "3.4"
    quest: >-
      Show me every product with its sales in the West region. Products never sold in the
      West must still appear.
    path:
      answer: agentql
      why:
        keyword: >-
          Not Keyword Search. Keywords can't keep products that have no West sales: they would
          silently drop out. That needs an outer join.
        agentql: >-
          AgentQL. "Every product, sold or not" takes an outer join, which keywords can't
          express on this Model. The Wizard writes it.
        code_complete: >-
          Not Code Complete. Nothing here needs analysis beyond SQL; an outer join is a
          database job, so it stays in governed SQL.
    agentql: |
      WITH all_p AS (
        SELECT "t1"."product" AS p
        FROM "(Sample) Retail - Apparel" AS "t1" GROUP BY "t1"."product"
      ), west AS (
        SELECT "t2"."product" AS p, SUM("t2"."sales") AS s
        FROM "(Sample) Retail - Apparel" AS "t2"
        WHERE "t2"."region" = 'West' GROUP BY "t2"."product"
      )
      SELECT a.p AS product, COALESCE(west.s, 0) AS west_sales
      FROM all_p a
      LEFT OUTER JOIN west ON a.p = west.p
    points:
      - kind: who
        answer: model
        rule: The Model's joins and keys apply inside your query
        sql:
          - 'JOIN "RETAILAPPAREL"."PUBLIC"."DIM_RETAPP_PRODUCTS" "ta_2"'
          - 'ON "ta_3"."PRODUCTID" = "ta_2"."PRODUCTID"'
          - 'JOIN "RETAILAPPAREL"."PUBLIC"."DIM_RETAPP_STORES" "ta_4"'
          - 'ON "ta_3"."STOREID" = "ta_4"."STOREID"'
        sql_count: {'JOIN "RETAILAPPAREL"': 2}             # "two inner joins"
        scroll: ['FROM "(Sample) Retail - Apparel" AS "t2"']
        ask: >-
          Two inner joins, on PRODUCTID and STOREID. Your scroll reads from the Model and
          mentions no keys. Who put these joins here?
        hint: >-
          Neither key appears in your scroll, and ThoughtSpot compiles the SQL that runs. Who
          knows how the tables relate?
        lesson: >-
          The Model supplied the relationships: the join type and the keys. Two people asking
          this question get the same joins, every time.
      - kind: who
        answer: agentql
        rule: Every product kept, sold in the West or not
        sql: ['LEFT OUTER JOIN "qt_1" "ta_6"', 'ON "ta_5"."ca_1" = "ta_6"."ca_2"']
        sql_count: {'LEFT OUTER JOIN': 1, 'WHERE': 1}   # one outer join; one filter, and no filter after it
        sql_before: [["WHERE LOWER(\"ta_4\".\"REGION\") = 'west'", 'LEFT OUTER JOIN "qt_1" "ta_6"']]  # filter inside, so unsold products survive
        scroll: ['LEFT OUTER JOIN west']
        ask: >-
          A LEFT OUTER JOIN keeps the products with no West sales, although the Model's own
          join is INNER. Look at the highlighted line in your scroll. Who put it here?
        hint: >-
          Not every line comes from the Model. This one goes against the Model's default join,
          and it is in your scroll.
        lesson: >-
          Your AgentQL. This is the expressibility AgentQL adds. ThoughtSpot kept your join
          shape and still applied the Model's keys, and its own null guards, inside it.
      - kind: choice
        rule: Row-level security rules come from the Model and are added when ThoughtSpot compiles
        rule_by: model
        sql: []
        scroll: []
        ask: >-
          The dragon rears up. This sample Model has no row-level security (RLS). If it had,
          ThoughtSpot would add each user's RLS filter while compiling. Could the Wizard (the
          AI) leave that filter out by not writing it in the scroll?
        options:
          - text: No. The Forge (ThoughtSpot) adds the Model's filter while compiling
            correct: true
          - text: Yes, by leaving the filter out of the AgentQL
          - text: Yes, if the Wizard words the question cleverly
        hint: The filter is not something the Wizard writes. Where are the RLS rules defined?
        lesson: >-
          The RLS rules live in the Model, and ThoughtSpot adds them when it compiles, so
          leaving them out of the AgentQL changes nothing: the agent never wrote them. Each
          user gets their own filter. Lesson 3.3 shows the injected filter.
    takeaway: >-
      The outer join was yours: the flexibility AgentQL adds. Everything else was a rule from
      the Model and ThoughtSpot, applied exactly as it is to every other query.

  # ---- Golden Forests: a question in two steps --------------------------------------------------
  - case: l5_cte_two_step
    lesson: "5.1"
    quest: What is the average total sales per store?
    path:
      answer: agentql
      why:
        keyword: >-
          Not Keyword Search. This is a question in two steps: total each store, then average
          those totals. Multi-stage analysis like that is what AgentQL adds.
        agentql: >-
          AgentQL. Two steps, a total per store and then an average of those totals, take a
          CTE, which the Wizard can write.
        code_complete: >-
          Not Code Complete. Both steps can be written in AgentQL, so they stay in governed SQL.
    agentql: |
      WITH st AS (
        SELECT "t1"."store" AS store, SUM("t1"."sales") AS s
        FROM "(Sample) Retail - Apparel" AS "t1" GROUP BY "t1"."store")
      SELECT AVG(st.s) AS avg_store_sales, COUNT(st.store) AS n FROM st
    points:
      - kind: who
        answer: agentql
        rule: The question built in two steps
        sql: ['WITH "qt_0" AS (', 'FROM "qt_0" "ta_3"']
        scroll: ['WITH st AS (', 'FROM st']
        ask: >-
          The SQL first builds a step called qt_0, then averages over it. Who decided the
          question needed two steps?
        hint: Look at the first line of your scroll.
        lesson: >-
          Your AgentQL. The CTE is the shape of your question. ThoughtSpot kept both steps and
          compiled each one against the Model.
      - kind: who
        answer: model
        rule: Business names map to physical columns
        sql: ['"ta_1"."STORENAME" "ca_1",']
        scroll: ['"t1"."store" AS store']
        ask: Your scroll asked for "store". The SQL reads STORENAME. Who translated it?
        hint: Your scroll uses business names only. Something maps them to the warehouse.
        lesson: >-
          The Model. You query business names like "store", and the Model maps each one to its
          physical column.
      - kind: who
        answer: model
        rule: Joins and their keys come from the Model
        sql:
          - 'JOIN "RETAILAPPAREL"."PUBLIC"."DIM_RETAPP_STORES" "ta_1"'
          - 'ON "ta_2"."STOREID" = "ta_1"."STOREID"'
        sql_count: {'JOIN "RETAILAPPAREL"': 1}
        scroll: []
        ask: >-
          Inside the first step, sales are joined to stores on STOREID. Your scroll has no join
          at all. Who added it?
        hint: Store names and sales live in different tables. Who knows how they connect?
        lesson: >-
          The Model. Grouping sales by store needs the stores table, so the Model's join and
          keys go in, even inside your CTE.
      - kind: who
        answer: thoughtspot
        rule: A row cap is added to the statement
        sql: ['LIMIT 100000']
        sql_last_line: LIMIT 100000
        sql_count: {'LIMIT': 1}                 # one row cap, and it closes the statement
        scroll: []
        ask: LIMIT 100000 closes the statement. Your scroll has no LIMIT. Who added it?
        hint: It isn't in your scroll, and ThoughtSpot compiles the SQL that runs.
        lesson: ThoughtSpot capped this statement at 100,000 rows, even with its two steps.
    takeaway: >-
      The two steps were yours. Inside each step, the Model and ThoughtSpot applied the same
      rules they apply everywhere, so the result is just as repeatable.

  # ---- Shifting Isles: ranking within each region ------------------------------------------------
  - case: l5_rank
    lesson: "5.2"
    quest: Rank each region's stores by their sales.
    path:
      answer: agentql
      why:
        keyword: >-
          Not Keyword Search. Ranking within each region, rather than across everything, needs
          a window function, which keywords can't express.
        agentql: >-
          AgentQL. A rank within each region is a window function, and the Wizard can write one.
        code_complete: >-
          Not Code Complete. A ranking can be written in AgentQL, so it stays in governed SQL.
    agentql: |
      SELECT "t1"."region" AS r, "t1"."store" AS store, SUM("t1"."sales") AS s,
             RANK() OVER (PARTITION BY "t1"."region" ORDER BY SUM("t1"."sales") DESC) AS rk
      FROM "(Sample) Retail - Apparel" AS "t1"
      GROUP BY "t1"."region", "t1"."store"
    points:
      - kind: who
        answer: agentql
        rule: A rank that restarts in every region
        sql: ['rank() over (partition by "ta_1"."REGION" order by CASE']
        scroll: ['RANK() OVER (PARTITION BY "t1"."region"']
        ask: >-
          rank() over (partition by REGION ...) ranks stores inside each region. Who asked for
          that?
        hint: Look at the second line of your scroll.
        lesson: >-
          Your AgentQL. The window function is the expressibility AgentQL adds: a rank that
          restarts in every region.
      - kind: who
        answer: thoughtspot
        rule: The sum the ranking orders by is null-safe too
        sql: ['WHEN sum("ta_2"."SALES") IS NOT NULL THEN sum("ta_2"."SALES")']
        sql_count: {'WHEN sum("ta_2"."SALES") IS NOT NULL THEN sum("ta_2"."SALES")': 2, 'ELSE 0': 2}
        scroll: ['ORDER BY SUM("t1"."sales") DESC']
        ask: >-
          The ranking orders stores by the null-safe sum, CASE WHEN ... ELSE 0, and the same
          guard wraps the sales column. Your scroll ordered by a plain SUM. Who made it safe?
        hint: Your scroll has no null check anywhere.
        lesson: >-
          ThoughtSpot. The SUM your window function orders by gets the same null guard as the
          sales column, so the ranking orders by exactly the totals you see.
      - kind: who
        answer: model
        rule: Joins and their keys come from the Model
        sql:
          - 'JOIN "RETAILAPPAREL"."PUBLIC"."DIM_RETAPP_STORES" "ta_1"'
          - 'ON "ta_2"."STOREID" = "ta_1"."STOREID"'
        scroll: []
        ask: Sales are joined to stores on STOREID. Your scroll has no join. Who added it?
        hint: Region and store live in a different table from sales.
        lesson: >-
          The Model. Region and store come from the stores table, so its join and keys go in,
          the same as for a simple total.
      - kind: choice
        rule: The same AgentQL, Model and user always compile to the same SQL
        rule_by: determinism
        sql: ['*']
        scroll: ['*']
        ask: >-
          Final blow. The Wizard carries the exact same scroll to the Forge a second time.
          What SQL comes out?
        options:
          - text: Exactly the same SQL, line for line
            correct: true
          - text: Slightly different SQL, because AI is involved
          - text: It depends on the Wizard's mood
        hint: Where does the AI sit, before ThoughtSpot compiles the scroll or inside it?
        lesson: >-
          Same scroll, same Model, same user: same SQL, however advanced the shape. That is what
          makes the answer repeatable, and testable.
    takeaway: >-
      The ranking was yours. The rules inside it were the same ones that governed the simplest
      question in the mines: however advanced the shape, the governed parts never change.
