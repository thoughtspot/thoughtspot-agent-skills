# Audit categories ("angles"). The report's tabs, heatmap columns and labels come from
# here; `ts audit run --angles` selects categories by id, and a rule runs when any of
# its `categories` is selected. Ids are stable: never rename or reuse one.
- id: A
  label: AI Readiness
  order: 1
  description: Description/synonym coverage, AI context, Spotter readiness score.
- id: D
  label: Data Modeling
  order: 2
  description: Complexity, join quality/types, progressive joins, duplicates, grain consistency, SQL pass-through, zero-column tables.
- id: H
  label: Human Readiness
  order: 3
  description: Name quality, hidden columns, orphans, direct table connections, formula promotion candidates.
- id: P
  label: Performance
  order: 4
  description: SQL Views, scalar formulas, filter/join progressiveness, date constraints, column sprawl.
- id: S
  label: Security
  order: 5
  description: PII detection, indexing without RLS, CLS gaps, RLS bypass, credentials in analytics.
