# Assessment profiles — the bar an audit is measured against (ts-audit SKILL Step 2b).
# A profile is a named override layer: a rule's `profiles.<id>` block may replace only
# the overridable keys (status, bands, severity, message, remediation). Exactly one
# profile is the default.
- id: spotter
  label: Spotter-ready
  default: false
  description: aggressive, the bar for a Model Spotter will answer from (AI context required)
- id: general
  label: General
  default: true
  description: lighter, the bar for Search and Liveboards (AI context recommended)
