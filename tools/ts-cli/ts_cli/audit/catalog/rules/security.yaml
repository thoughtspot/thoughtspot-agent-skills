# Rules whose primary category is S (Security). One list entry per rule;
# the shape is documented in ts_cli/audit/catalog_model.py and checked by
# tools/validate/check_audit_catalog.py.
#
# None of these is profile-aware: the catalog default holds under both profiles.
# The PII and credential name heuristics are derived fields (@pii_category,
# @pii_confidence, @credential_term in engine/fields.py), one copy shared by S1-S5.
# S3 and S8 were retired and S9 merged into P14 in 2026-10. Titles are the legacy
# CHECK_META descriptions; S1-S5 carry the report's existing remediation text, S10
# has never had one.

- id: S1
  title: PII column detection (heuristic regex)
  evidence: heuristic
  description: >-
    A Model column whose name reads as personal data — email, phone, national id,
    date of birth, financial account, person name or street address (the first
    matching pattern names the category). Always INFO: the pattern's confidence is
    reported in the detail, never graded.
  categories: [S]
  requires: [model_tml]
  scope: model.column
  aggregate:
    mode: each
    where: {field: "@pii_category", exists: true}
  severity: INFO
  message: "PII detected ({@pii_category}, {@pii_confidence} confidence): '{name}'"
  remediation: Review security settings via ThoughtSpot UI or TML reimport
  examples:
    fires: {fixture: sec_model_email_column, severity: INFO}
    silent: {fixture: sec_model_without_pii}

- id: S2
  title: PII indexed without RLS (exposes in autocomplete)
  evidence: heuristic
  description: >-
    A PII column (see S1) that is text-search indexed (no `index_type: DONT_INDEX`),
    so its values surface in search suggestions. MEDIUM when the Table its
    `column_id` prefix names (through `model_tables`, alias first) has no RLS rules
    on its Table TML — or that Table TML is not in scope — and INFO when it has. The
    detail says which, so the message is worded per severity. The column is PII by a
    name match, so the grade is capped at MEDIUM (the severity rubric, 2026-11; HIGH
    until then).
  categories: [S]
  requires: [model_tml]
  scope: model.column
  aggregate:
    mode: each
    where:
      all:
        - {field: "@pii_category", exists: true}
        - {field: "@is_indexed", truthy: true}
  severity: {field: "@owning_table_has_rls", map: {true: INFO}, default: MEDIUM}
  message:
    by_severity:
      MEDIUM: "PII column '{name}' is indexed WITHOUT table RLS"
      INFO: "PII column '{name}' is indexed (table has RLS)"
  remediation: Review security settings via ThoughtSpot UI or TML reimport
  examples:
    fires: {fixture: sec_pii_indexed_without_rls, severity: MEDIUM}
    silent: {fixture: sec_pii_not_indexed}

- id: S3
  title: PII without CLS or masking formula
  description: >-
    Retired 2026-10: it reported "no CLS or masking formula" but never read column
    security, only a heuristic over the Model's formula text. A check that reads
    Column Security Rules would be a new rule with a new id.
  status: retired
  categories: [S]
  requires: [model_tml]
  scope: model.column
  aggregate:
    mode: each
    where:
      all:
        - {field: "@pii_category", exists: true}
        - {field: "@named_in_masking_formula", truthy: false}
  severity: HIGH
  message: "PII column '{name}' ({@pii_category}) has no CLS or masking formula"
  remediation: Review security settings via ThoughtSpot UI or TML reimport

- id: S4
  title: RLS bypass + PII columns in model
  evidence: heuristic
  description: >-
    A Model with `properties.is_bypass_rls` set that also holds PII columns (see
    S1). Counted as the PII columns of a bypassing Model, so the count is 0 — and
    silent — without the bypass. PII is a name match, so MEDIUM (the severity rubric,
    2026-11; HIGH until then).
  categories: [S]
  requires: [model_tml]
  scope: model
  aggregate:
    mode: count
    over: model.column
    where:
      all:
        - {field: parent.properties.is_bypass_rls, truthy: true}
        - {field: "@pii_category", exists: true}
  bands:
    direction: lower_is_better
    unit: count
    levels:
      - {op: gt, value: 0, severity: MEDIUM}
  message: "RLS bypass enabled AND model contains {count} PII column(s)"
  remediation: Review security settings via ThoughtSpot UI or TML reimport
  examples:
    fires: {fixture: sec_bypass_with_pii, severity: MEDIUM}
    silent: {fixture: sec_bypass_without_pii}

- id: S5
  title: Credentials in analytics
  evidence: heuristic
  severity_exception:
    reason: A real credential in an analytics Model is severe enough that a name match alone warrants it.
    approved: 2026-11-02
  description: >-
    A Model column named like a credential — password, passwd, secret key or api key
    (joined, hyphenated, underscored or spaced: "API Key" since 2026-10), or token,
    each as a whole word, any case. CRITICAL, except HIGH for `token`.
  categories: [S]
  requires: [model_tml]
  scope: model.column
  aggregate:
    mode: each
    where: {field: "@credential_term", exists: true}
  severity: {field: "@credential_term", map: {token: HIGH}, default: CRITICAL}
  message: "Credential column '{name}' in analytics model"
  remediation: Review security settings via ThoughtSpot UI or TML reimport
  examples:
    fires: {fixture: sec_password_column, severity: CRITICAL}
    silent: {fixture: sec_model_without_pii}

- id: S8
  title: VARCHAR column used in an RLS rule
  description: >-
    Retired 2026-10: a text column in an RLS rule is not a security problem. P15 (the
    same column with no value_casing) is unaffected.
  status: retired
  categories: [S]
  requires: [table_tml]
  scope: rls_column_ref
  aggregate:
    mode: each
    where: {field: "@is_string_type", truthy: true}
  severity: MEDIUM
  message: "VARCHAR RLS column '{name}'"

- id: S9
  title: Function call in an RLS rule expression
  description: >-
    Retired 2026-10: merged into P14. A function in an RLS rule costs query performance;
    it is not a security gap.
  status: retired
  categories: [S]
  scope: table.rls_rule

- id: S10
  title: RLS bypass enabled (disables row-level security)
  evidence: fact
  description: A Model with `properties.is_bypass_rls` set, so every user sees every row.
  categories: [S]
  requires: [model_tml]
  scope: model
  aggregate:
    mode: each
    where: {field: properties.is_bypass_rls, truthy: true}
  severity: MEDIUM
  message: "is_bypass_rls: true — all users see all rows regardless of RLS rules"
  examples:
    fires: {fixture: sec_bypass_without_pii, severity: MEDIUM}
    silent: {fixture: sec_model_without_pii}

- id: S11
  title: RLS join closes a loop with the Model's joins
  evidence: fact
  description: >-
    The Model's join graph plus the joins an RLS rule on one of its Tables uses (a
    join on a path some rule expression references, walked outward from the secured
    table). ThoughtSpot checks only the Model's own joins at import, so a rule that
    joins back into the Model's graph imports cleanly and then fails every query it
    applies to with "Guid Mismatch" — query generation sees one table with two roots.
    CRITICAL: the Model is broken for every user the rule applies to, not merely at risk. One finding per RLS join that closes such a loop. Second routes (diamonds) through
    an RLS join are not reported: nothing shows them failing.
  # A code rule (code:rls_join_cycles) because it is a graph search over the Model's
  # joins and its Tables' RLS rules (ts_cli/tml_rls_graph.py, shared with lint I22).
  categories: [S]
  requires: [model_tml]
  implementation: code:rls_join_cycles
  scope: model
  severity: CRITICAL
  message: >-
    RLS on '{table}' joins out to '{target}' ('{join}'), and joins lead back {back}
    — a loop query generation cannot resolve (queries fail with "Guid Mismatch")
  remediation: >-
    Drop one of the two joins, or point the Model at a copy of the table without this
    RLS rule (or move the rule to another table).
  examples:
    fires: {fixture: sec_rls_join_cycle, severity: CRITICAL}
    silent: {fixture: sec_rls_same_direction}

- id: S12
  title: RLS table outer-joined without a null clause
  evidence: fact
  description: >-
    A Model join of type LEFT_OUTER, RIGHT_OUTER or OUTER whose optional side — the
    `with` table for LEFT_OUTER, the declaring table for RIGHT_OUTER, both for OUTER —
    is a Table carrying RLS rules, none of which has a null branch (`is_null ( … )`,
    `isnull ( … )` or `= null`). The docs' "Respect join definitions" (security-rls) show that such a
    rule must test the joined column for null or the outer join behaves as an inner one
    for users under the rule: they lose the rows it kept. Whether it does also depends
    on cluster settings the audit cannot read, so MEDIUM: review the rule (product
    owner, 2026-11-04). A Table with no TML in scope is unknown and not reported.
  categories: [S]
  requires: [model_tml, table_tml]
  scope: join
  aggregate:
    mode: each
    where: {field: "@outer_join_unguarded_rls", nonblank: true}
  severity: MEDIUM
  message: "{obj.type} join '{name}' keeps unmatched rows that {@outer_join_unguarded_rls} has no row for, and its RLS rules have no null branch — users under them may get an inner join instead"
  remediation: Review the rule against the docs' "Respect join definitions" — add an `or` null test on the column the join type needs (both sides for a full outer join), in the spelling your cluster accepts, or make the join INNER if unmatched rows are not wanted. Testing the join key (never null) keeps unmatched rows without showing the table's ownerless rows; a null test on the owner column also shows those to every user (S15)
  examples:
    fires: {fixture: sec_rls_outer_joined_unguarded, severity: MEDIUM}
    silent: {fixture: sec_rls_outer_joined_isnull}

- id: S13
  title: RLS rule search cannot index
  evidence: fact
  description: >-
    An RLS rule whose expression names neither `ts_groups` (any variant) nor
    `ts_username`, or that compares with `!=` or `<>`. Per the RLS implementation docs,
    ThoughtSpot builds no suggestion index for such a rule; that includes rules built
    only on `ts_org`, `ts_email_domain` or custom variables.
  categories: [S]
  requires: [table_tml]
  scope: table.rls_rule
  aggregate:
    mode: each
    where:
      all:
        - {field: expr, regex: '\S'}
        - any:
            - {field: expr, not_regex: '(?i)\bts_(groups\w*|username)\b'}
            - {field: expr, regex: '!=|<>'}
  severity: LOW
  message: "RLS rule '{obj.name}' builds no suggestion index (no ts_groups / ts_username, or a != comparison): {obj.expr:.80}"
  remediation: Express the rule with ts_groups or ts_username and an equality, so search suggestions are indexed per user
  examples:
    fires: {fixture: sec_rls_custom_variable_rule, severity: LOW}
    silent: {fixture: sec_rls_groups_rule}

- id: S14
  title: RLS Tables scope users by different variables
  evidence: heuristic
  description: >-
    A Model with two or more Tables whose RLS rules scope users by different sets of
    session variables — ts_groups (any variant), ts_username, ts_org, ts_email_domain or
    a custom `ts_var ( name )` — so one search can scope the same user one way on one
    Table and another way on the next (BL-512). Two variables on one Table (an owner or
    a group override) is not a difference. That can be intended (a per-user Table beside a
    per-group one); it cannot be told from the TML, so LOW: review that they select the
    same users (product owner, 2026-11-04).
  categories: [S]
  requires: [model_tml, table_tml]
  scope: model
  aggregate:
    mode: each
    where: {field: "@rls_session_variables", len_gt: 1}
  severity: LOW
  message: "'{name}' has RLS rules scoping users by {@rls_session_variables} on different Tables — review that they select the same users"
  remediation: Review the Tables' RLS rules together; if they should scope users the same way, compare against the same variable on each
  examples:
    fires: {fixture: sec_rls_two_tenant_variables, severity: LOW}
    silent: {fixture: sec_rls_one_tenant_variable}

- id: S15
  title: RLS null test on the secured Table's own column
  evidence: heuristic
  description: >-
    An RLS rule that tests for null (`is_null` / `isnull ( … )` or `= null`) a column of
    its own Table that it also scopes users by — the owner key. Such a test keeps an
    outer join's unmatched rows (S12) but also shows every row of this Table with no
    owner to every user under the rule (BL-512). A null test on a key that is never null,
    such as the join key, keeps the unmatched rows without that and is not reported.
    LOW: review whether ownerless rows should be visible (product owner, 2026-11-04).
  categories: [S]
  requires: [table_tml]
  scope: table.rls_rule
  aggregate:
    mode: each
    where: {field: "@own_column_null_tests", nonblank: true}
  severity: LOW
  message: "RLS rule '{obj.name}' keeps rows whose {@own_column_null_tests} is null for every user — review whether ownerless rows should be visible"
  remediation: If the null test is there for an outer join (S12), test the join key instead (a column that is never null, such as `isnull ( [T_1::KEY] )`), so unmatched rows are kept and ownerless ones are not; otherwise give ownerless rows an owner, or drop the null branch
  examples:
    fires: {fixture: sec_rls_null_test_on_own_column, severity: LOW}
    silent: {fixture: sec_rls_null_test_on_joined_column}

- id: S16
  title: RLS Tables scope users through different columns
  evidence: heuristic
  description: >-
    A Model with two or more Tables whose RLS rules scope users through different sets
    of column names — the `[path::COLUMN]` references in a rule's `and` / `or` clauses
    that name a session variable, outside quoted literals and null tests; a column only
    compared with a literal is not read; names compared without case — so the Tables
    may hold the tenant in different keys (BL-521, G5e's keys half). Often
    intended (each Table keys its own column); it cannot be told from the TML, so LOW:
    review that the columns hold the same tenant values (product owner, 2026-11-05: any
    difference counts).
  categories: [S]
  requires: [model_tml, table_tml]
  scope: model
  aggregate:
    mode: each
    where: {field: "@rls_key_columns", len_gt: 1}
  severity: LOW
  message: "'{name}' has Tables whose RLS rules scope users through different columns (of {@rls_key_columns}) — review that they select the same users"
  remediation: Review the Tables' RLS rules together; if they should scope users the same way, compare the same tenant key on each, or check that each column holds the same values
  examples:
    fires: {fixture: sec_rls_two_key_columns, severity: LOW}
    silent: {fixture: sec_rls_one_key_column}

