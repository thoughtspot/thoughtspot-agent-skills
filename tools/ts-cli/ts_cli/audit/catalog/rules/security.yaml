# Rules whose primary category is S (Security). One list entry per rule;
# the shape is documented in ts_cli/audit/catalog_model.py and checked by
# tools/validate/check_audit_catalog.py.
#
# None of these is profile-aware: the catalog default holds under both profiles.
# The PII and credential name heuristics are derived fields (@pii_category,
# @pii_confidence, @credential_term in engine/fields.py), one copy shared by S1-S5.
# S3 and S8 were retired and S9 merged into P14 in 2026-10. Titles are the legacy
# CHECK_META descriptions; S1-S5 carry the report's existing remediation text, S10
# has never had one.

- id: S1
  title: PII column detection (heuristic regex)
  description: >-
    A Model column whose name reads as personal data — email, phone, national id,
    date of birth, financial account, person name or street address (the first
    matching pattern names the category). Always INFO: the pattern's confidence is
    reported in the detail, never graded.
  categories: [S]
  requires: [model_tml]
  scope: model.column
  aggregate:
    mode: each
    where: {field: "@pii_category", exists: true}
  severity: INFO
  message: "PII detected ({@pii_category}, {@pii_confidence} confidence): '{name}'"
  remediation: Review security settings via ThoughtSpot UI or TML reimport
  examples:
    fires: {fixture: sec_model_email_column, severity: INFO}
    silent: {fixture: sec_model_without_pii}

- id: S2
  title: PII indexed without RLS (exposes in autocomplete)
  description: >-
    A PII column (see S1) that is text-search indexed (no `index_type: DONT_INDEX`),
    so its values surface in search suggestions. HIGH when the Table its
    `column_id` prefix names (through `model_tables`, alias first) has no RLS rules
    on its Table TML — or that Table TML is not in scope — and INFO when it has. The
    detail says which, so the message is worded per severity.
  categories: [S]
  requires: [model_tml]
  scope: model.column
  aggregate:
    mode: each
    where:
      all:
        - {field: "@pii_category", exists: true}
        - {field: "@is_indexed", truthy: true}
  severity: {field: "@owning_table_has_rls", map: {true: INFO}, default: HIGH}
  message:
    by_severity:
      HIGH: "PII column '{name}' is indexed WITHOUT table RLS"
      INFO: "PII column '{name}' is indexed (table has RLS)"
  remediation: Review security settings via ThoughtSpot UI or TML reimport
  examples:
    fires: {fixture: sec_pii_indexed_without_rls, severity: HIGH}
    silent: {fixture: sec_pii_not_indexed}

- id: S3
  title: PII without CLS or masking formula
  description: >-
    Retired 2026-10: it reported "no CLS or masking formula" but never read column
    security, only a heuristic over the Model's formula text. A check that reads
    Column Security Rules would be a new rule with a new id.
  status: retired
  categories: [S]
  requires: [model_tml]
  scope: model.column
  aggregate:
    mode: each
    where:
      all:
        - {field: "@pii_category", exists: true}
        - {field: "@named_in_masking_formula", truthy: false}
  severity: HIGH
  message: "PII column '{name}' ({@pii_category}) has no CLS or masking formula"
  remediation: Review security settings via ThoughtSpot UI or TML reimport

- id: S4
  title: RLS bypass + PII columns in model
  description: >-
    A Model with `properties.is_bypass_rls` set that also holds PII columns (see
    S1). Counted as the PII columns of a bypassing Model, so the count is 0 — and
    silent — without the bypass.
  categories: [S]
  requires: [model_tml]
  scope: model
  aggregate:
    mode: count
    over: model.column
    where:
      all:
        - {field: parent.properties.is_bypass_rls, truthy: true}
        - {field: "@pii_category", exists: true}
  bands:
    direction: lower_is_better
    unit: count
    levels:
      - {op: gt, value: 0, severity: HIGH}
  message: "RLS bypass enabled AND model contains {count} PII column(s)"
  remediation: Review security settings via ThoughtSpot UI or TML reimport
  examples:
    fires: {fixture: sec_bypass_with_pii, severity: HIGH}
    silent: {fixture: sec_bypass_without_pii}

- id: S5
  title: Credentials in analytics
  description: >-
    A Model column named like a credential — password, passwd, secretkey or
    secret_key / secret-key, apikey or api_key / api-key, or token, each as a whole
    word, any case (a spaced "API Key" is not matched). CRITICAL, except HIGH for
    `token`.
  categories: [S]
  requires: [model_tml]
  scope: model.column
  aggregate:
    mode: each
    where: {field: "@credential_term", exists: true}
  severity: {field: "@credential_term", map: {token: HIGH}, default: CRITICAL}
  message: "Credential column '{name}' in analytics model"
  remediation: Review security settings via ThoughtSpot UI or TML reimport
  examples:
    fires: {fixture: sec_password_column, severity: CRITICAL}
    silent: {fixture: sec_model_without_pii}

- id: S8
  title: VARCHAR column used in an RLS rule
  description: >-
    Retired 2026-10: a text column in an RLS rule is not a security problem. P15 (the
    same column with no value_casing) is unaffected.
  status: retired
  categories: [S]
  requires: [table_tml]
  scope: rls_column_ref
  aggregate:
    mode: each
    where: {field: "@is_string_type", truthy: true}
  severity: MEDIUM
  message: "VARCHAR RLS column '{name}'"

- id: S9
  title: Function call in an RLS rule expression
  description: >-
    Retired 2026-10: merged into P14. A function in an RLS rule costs query performance;
    it is not a security gap.
  status: retired
  categories: [S]
  scope: table.rls_rule

- id: S10
  title: RLS bypass enabled (disables row-level security)
  description: A Model with `properties.is_bypass_rls` set, so every user sees every row.
  categories: [S]
  requires: [model_tml]
  scope: model
  aggregate:
    mode: each
    where: {field: properties.is_bypass_rls, truthy: true}
  severity: MEDIUM
  message: "is_bypass_rls: true — all users see all rows regardless of RLS rules"
  examples:
    fires: {fixture: sec_bypass_without_pii, severity: MEDIUM}
    silent: {fixture: sec_model_without_pii}

- id: S11
  title: RLS join closes a loop with the Model's joins
  description: >-
    The Model's join graph plus the joins an RLS rule on one of its Tables uses (a
    join on a path some rule expression references, walked outward from the secured
    table). ThoughtSpot checks only the Model's own joins at import, so a rule that
    joins back into the Model's graph imports cleanly and then fails every query it
    applies to with "Guid Mismatch" — query generation sees one table with two roots.
    CRITICAL: the Model is broken for every user the rule applies to, not merely at risk. One finding per RLS join that closes such a loop. Second routes (diamonds) through
    an RLS join are not reported: nothing shows them failing.
  # A code rule (code:rls_join_cycles) because it is a graph search over the Model's
  # joins and its Tables' RLS rules (ts_cli/tml_rls_graph.py, shared with lint I22).
  categories: [S]
  requires: [model_tml]
  implementation: code:rls_join_cycles
  scope: model
  severity: CRITICAL
  message: >-
    RLS on '{table}' joins out to '{target}' ('{join}'), and joins lead back {back}
    — a loop query generation cannot resolve (queries fail with "Guid Mismatch")
  remediation: >-
    Drop one of the two joins, or point the Model at a copy of the table without this
    RLS rule (or move the rule to another table).
  examples:
    fires: {fixture: sec_rls_join_cycle, severity: CRITICAL}
    silent: {fixture: sec_rls_same_direction}

# Ids used before the catalog existed (see perf.yaml's P10): retired so they are never
# reused.
- id: S6
  title: Conformed dimension divergence (pre-catalog)
  description: >-
    Retired before the rule catalog: ran as S6 until ts-audit's check overhaul (#131)
    moved the check to the data-modeling angle, where it runs as D12. Recorded as
    retired so the id is never reused.
  status: retired
  categories: [S]
  scope: model

- id: S7
  title: Reserved (never assigned)
  description: >-
    Retired without ever running: the id was left unassigned when the checks were
    renumbered (#131). Recorded as retired so it is never handed out by accident.
  status: retired
  categories: [S]
  scope: model
