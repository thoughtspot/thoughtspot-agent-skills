# Rules whose primary category is D (Data Modeling). One list entry per rule;
# the shape is documented in ts_cli/audit/catalog_model.py and checked by
# tools/validate/check_audit_catalog.py.
#
# None of these is profile-aware: the catalog default holds under both profiles.
# D2 and D4 were merged into P6 and P4 in 2026-10, which now sit in category D as
# well. Titles are the legacy
# CHECK_META descriptions; D7 and D8 carry the report's existing remediation text, the
# others have never had one. Where a rule words its findings differently by severity
# (D3, D7, D11), the message is `{by_severity: ...}` (catalog_forms.py).
#
# Known legacy defects reproduced here, not fixed (the pinned legacy answers hold the
# rules to them — tests/test_audit_pinned_findings.py; the spec's follow-up list owns the fixes): D10 and D11 look a model
# table up by its `name` where its columns carry its alias (BL-305); D11 words every
# INFO finding "ONE_TO_MANY", a MANY_TO_MANY join included.

- id: D1
  title: Model complexity exceeds threshold
  description: >-
    Three size measures per Model, each reported on its own when over its MEDIUM line
    and graded HIGH over its HIGH line: tables (30 / 50), joins (30 / 50) and formulas
    (30 / 50). Column count is P8's and join depth P7's. The table and join lines come
    from production call-home data (2026-10: 268k Models, 99th percentile 35 tables).
  # A code rule (code:model_complexity, grading table D1_MEASURES in
  # engine/code_rules.py) because one rule grades three measures against three pairs
  # of lines and reports each with its own legacy threshold — the catalog holds one set
  # of bands and one threshold per rule. Moving the lines into bands: BL-406.
  categories: [D]
  requires: [model_tml]
  implementation: code:model_complexity
  scope: model
  message: "{value} {measure} (>{yellow} HIGH, >{green} MEDIUM)"
  examples:
    fires: {fixture: data_model_fifty_one_tables, severity: HIGH}
    silent: {fixture: data_model_small}

- id: D2
  title: VARCHAR join keys detected
  description: >-
    Retired 2026-10: merged into P6, which now reports both of its halves (string-typed
    join keys LOW, a join on more than one key pair INFO) under Performance and Data
    Modeling.
  status: retired
  categories: [D]
  scope: join

- id: D3
  title: Join type analysis (FULL OUTER, LEFT/RIGHT)
  description: >-
    Outer joins (inline, or referencing a Table's `joins_with`; the model's own type
    wins; the type read case-insensitively): HIGH on each full outer join
    (ThoughtSpot's `OUTER`), and one INFO per Model listing its LEFT_OUTER and
    RIGHT_OUTER joins. Until 2026-10 each one-sided outer join was its own INFO
    finding.
  # A code rule (code:join_types) because one rule reports on two scopes: each full
  # outer join, and the Model its one-sided outer joins roll up to.
  categories: [D]
  requires: [model_tml]
  implementation: code:join_types
  scope: model
  message:
    by_severity:
      HIGH: FULL OUTER join causes performance issues
      INFO: "{count} LEFT/RIGHT outer join(s), which may drop or add rows in results: {joins}"
  examples:
    fires: {fixture: data_join_full_outer, severity: HIGH}
    silent: {fixture: data_join_inner}

- id: D4
  title: Progressive joins disabled on large models
  description: >-
    Retired 2026-10: merged into P4, the same rule, which now sits under both Performance
    and Data Modeling.
  status: retired
  categories: [D]
  scope: model

- id: D5
  title: Orphan tables in model (Cartesian risk)
  description: >-
    A table of a multi-table Model that is on neither side of any join — keyed by its
    alias, else its name, on both sides; a join's `with` is resolved to the table it
    names (by alias, id or name; until 2026-10 the raw `with` was compared).
  categories: [D]
  requires: [model_tml]
  scope: model.table
  aggregate:
    mode: each
    where:
      all:
        - {field: parent.model_tables, len_gt: 1}
        - {field: "@is_joined", truthy: false}
  severity: HIGH
  message: "Table '{name}' has no joins — Cartesian product risk"
  examples:
    fires: {fixture: data_model_unjoined_table, severity: HIGH}
    silent: {fixture: data_model_all_joined}

- id: D6
  title: Grain consistency — fact tables with >40% attributes
  description: >-
    Retired 2026-10: grain is set by a table's keys and dates, not by its share of
    attribute columns, so the rule judged grain on the wrong evidence.
  status: retired
  categories: [D]
  requires: [model_tml]
  scope: model.table
  aggregate:
    mode: each
    where:
      all:
        - {field: "@table_role", eq: fact}
        - {field: "@attribute_share", gt: 0.4}
    measure: "@attribute_pct"
  severity: LOW
  message: "Fact table '{name}' has {@attribute_count}/{@table_column_count} ATTRIBUTE columns (>40%)"
  legacy_threshold: {max_attribute_pct: 40}

- id: D7
  title: High model overlap detected
  description: >-
    Two Models whose table sets (each table's fqn, else its name) share tables, graded
    by Jaccard similarity: HIGH when identical, MEDIUM above 0.5 but only when a table
    both contain is a fact table (more than 3 MEASURE columns, found by alias else
    name) in either of them — Models that only reuse the same dimensions are not
    duplicates. Reported once per pair, on the first Model's guid.
  # A code rule (code:model_overlap) because the shared-fact test applies to a pair,
  # and only below identical: the pairwise mode filters items, never pairs.
  categories: [D]
  requires: [model_tml]
  implementation: code:model_overlap
  scope: model
  bands:
    direction: lower_is_better
    unit: ratio
    levels:
      - {op: gte, value: 1, severity: HIGH}
      - {op: gt, value: 0.5, severity: MEDIUM}
  message:
    by_severity:
      HIGH: "Identical table sets ({union} tables) — likely duplicate models"
      MEDIUM: "High overlap: {shared}/{union} tables shared (Jaccard {similarity:.2f})"
  legacy_threshold:
    by_severity:
      MEDIUM: {high_overlap: 0.5}
  remediation: Run /ts-dependency-manager (Repoint mode) to consolidate overlapping models
  examples:
    fires: {fixture: data_models_identical_tables, severity: HIGH}
    silent: {fixture: data_models_disjoint_tables}

- id: D8
  title: Duplicate table objects found
  description: >-
    Two or more Table objects (ONE_TO_ONE_LOGICAL or SQL_VIEW in the metadata) on one
    physical table — the same connection, database, schema and table name. Reported
    once per physical table, on the first object's guid.
  categories: [D]
  requires: [metadata]
  scope: metadata
  aggregate:
    mode: group
    kind: duplicates
    where: {field: type, in: [ONE_TO_ONE_LOGICAL, SQL_VIEW]}
    key: "@physical_table_key"
  bands:
    direction: lower_is_better
    unit: count
    levels:
      - {op: gt, value: 1, severity: HIGH}
  message: "{size} ThoughtSpot objects point to the same physical table"
  remediation: Run /ts-dependency-manager (Remove mode) to remove duplicate table objects
  views: [duplicates]
  examples:
    fires: {fixture: data_metadata_duplicate_table, severity: HIGH}
    silent: {fixture: data_metadata_same_name_other_schema}

- id: D9
  title: SQL pass-through function usage (>20% formulas)
  description: >-
    More than 20% of a Model's formulas call a SQL pass-through aggregate,
    `sql_<type>_aggregate_op` for any type — int, double, string, bool, date and the
    rest (any case). Before 2026-10 only the int, string and bool forms were matched.
  categories: [D]
  requires: [model_tml]
  scope: model
  aggregate:
    mode: ratio
    over: model.formula
    match: {field: expr, regex: '(?i)\bsql_[a-z_]+_aggregate_op\b'}
  bands:
    direction: lower_is_better
    unit: percent
    levels:
      - {op: gt, value: 20, severity: LOW}
  message: "{matched}/{total} formulas use sql_*_aggregate_op ({pct:.0f}%)"
  legacy_threshold: {max_pct: 20}
  examples:
    fires: {fixture: data_model_half_sql_passthrough, severity: LOW}
    silent: {fixture: data_model_one_in_five_sql_passthrough}

- id: D10
  title: Zero-column tables (bridge vs leaf)
  description: >-
    A model table no model column comes from: INFO when it is on either side of a
    join (a bridge), MEDIUM when not (a leaf). Looked up and reported by its alias,
    else its name; a join's target is resolved by alias, id or name. Until 2026-10 it
    went by `name`, so every aliased table read zero-column.
  # A code rule (code:zero_column_tables): the role and the reporting name are computed
  # together per table.
  categories: [D]
  requires: [model_tml]
  implementation: code:zero_column_tables
  scope: model.table
  severity: {field: "@zero_column_role", map: {bridge: INFO}, default: MEDIUM}
  message: "Zero-column {role} table '{name}'"
  examples:
    fires: {fixture: data_model_zero_column_leaf, severity: MEDIUM}
    silent: {fixture: data_model_every_table_has_columns}

- id: D11
  title: Fan-out join risk (row multiplication)
  description: >-
    A join whose cardinality contains ONE_TO_MANY or MANY_TO_MANY: MEDIUM when both
    ends read as fact tables (more than 3 MEASURE columns), INFO otherwise. A
    referencing join takes its cardinality from the model, else from the Table's
    `joins_with` entry (exported Table TML usually carries none). Both ends are found
    by alias, else name: the declaring model table, and the table the join's `with`
    names (by alias, id or name). Until 2026-10 they were looked up by `name`, so an
    aliased end read as unknown.
  categories: [D]
  requires: [model_tml]
  scope: join
  aggregate:
    mode: each
    where:
      any:
        - {field: "@join_cardinality", contains: ONE_TO_MANY}
        - {field: "@join_cardinality", contains: MANY_TO_MANY}
  severity: {field: "@is_fact_to_fact_join", map: {true: MEDIUM}, default: INFO}
  message:
    by_severity:
      MEDIUM: "Fan-out risk: fact-to-fact join '{@join_from_name}' -> '{obj.with}' with {@join_cardinality}"
      INFO: "{@join_cardinality} join '{@join_from_name}' -> '{obj.with}'"
  examples:
    fires: {fixture: data_fanout_fact_to_fact, severity: MEDIUM}
    silent: {fixture: data_fanout_many_to_one}

- id: D12
  title: Conformed dimension divergence
  description: >-
    A column (by `db_column_name`, else `name`) whose column type differs between
    Models. Each Model contributes one type per column name — a later column, or a
    later Model of the same name, overwrites an earlier one — and the detail lists
    every Model with its type.
  # A code rule (code:column_type_divergence) because it groups columns across Models
  # and reports one type per Model, which the group mode's per-item values cannot
  # express.
  categories: [D]
  requires: [model_tml]
  implementation: code:column_type_divergence
  scope: model
  severity: MEDIUM
  message: "Column '{name}' classified differently across models: {models}"
  examples:
    fires: {fixture: data_models_divergent_column_type, severity: MEDIUM}
    silent: {fixture: data_models_consistent_column_type}
