<div id="chart">
  <div class="legend">
    <div class="legend-item">
      <div class="legend-swatch" style="background:#555;"></div>
      <span>Historical</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#b45309;"></div>
      <span>Current policies — solid (in effect)</span>
    </div>
    <div class="legend-item">
      <svg width="18" height="6" style="display:inline-block;vertical-align:middle;">
        <line x1="0" y1="3" x2="18" y2="3" stroke="#166534" stroke-width="2" stroke-dasharray="4,3"/>
      </svg>
      <span class="legend-dashed-label">Stated policies — future target</span>
    </div>
  </div>
  <div class="chart-wrap">
    <canvas id="fanChart" role="img"></canvas>
  </div>
  <div class="metrics" id="metricsRow"></div>
</div>
