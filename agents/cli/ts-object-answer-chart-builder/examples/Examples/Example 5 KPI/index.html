<div id="chart">
  <div id="kpi-card">
    <div id="kpi-body">
      <div id="kpi-value-row">
        <span id="kpi-big-number"></span>
        <span id="kpi-year-label">by 2050</span>
      </div>
      <div id="kpi-bar-wrapper">
        <canvas id="progressChart"></canvas>
        <div id="kpi-tick"></div>
      </div>
      <div id="kpi-bar-labels">
        <span id="kpi-label-left">Reduction achieved</span>
        <span id="kpi-label-right"></span>
      </div>
    </div>
    <div id="kpi-footer">
      <span id="kpi-baseline"></span>
      <span id="kpi-target"></span>
    </div>
  </div>
</div>
