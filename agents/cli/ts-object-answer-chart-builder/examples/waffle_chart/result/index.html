<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital bed capacity by ward</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="chart">
  <div class="wrap">
    <div class="summary" id="kpis"></div>

    <div class="key">
      <div class="key-item">
        <svg viewBox="0 0 32 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M 2.5 3.5 L 5.7 3.5 L 5.7 13 L 12.5 13 L 12.5 8 L 23 8 Q 29 8 29 13 L 29 18.5 L 25.8 18.5 L 25.8 15.8 L 5.7 15.8 L 5.7 18.5 L 2.5 18.5 Z" fill="#7a85a3"/><circle cx="9.2" cy="10" r="2.9" fill="#7a85a3"/></svg>
        <span>occupied</span>
      </div>
      <div class="key-item">
        <svg viewBox="0 0 32 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M 2.5 3.5 L 5.7 3.5 L 5.7 13 L 12.5 13 L 12.5 11.6 L 24.5 11.6 Q 29 11.6 29 13 L 29 18.5 L 25.8 18.5 L 25.8 15.8 L 5.7 15.8 L 5.7 18.5 L 2.5 18.5 Z" fill="white" stroke="#7a85a3" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <span>available</span>
      </div>
      <div class="key-hint">hover a bed for details</div>
    </div>

    <div id="wards"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
