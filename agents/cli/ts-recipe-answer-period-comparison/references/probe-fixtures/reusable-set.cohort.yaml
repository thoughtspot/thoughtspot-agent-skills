cohort:
  name: ZZ_probe_period_comparison_set
  worksheet:
    id: '{model_name}'
    name: '{model_name}'
    fqn: '{model_guid}'
  config:
    cohort_type: SIMPLE
    cohort_grouping_type: GROUP_BASED
    anchor_column_id: Order Date
    groups:
    - name: Black Friday Days
      conditions:
      - operator: BW
        column_name: Order Date
        filter_value_type: DATE_FILTER
        date_filter_values:
        - type: EXACT_DATE_RANGE
          oper: between
          date_range:
            start_date: 11/23/2018
            end_date: 11/26/2018
          date_period: DAY
          for_each_period: NUM_DATE_PERIODS
      - operator: BW
        column_name: Order Date
        filter_value_type: DATE_FILTER
        date_filter_values:
        - type: EXACT_DATE_RANGE
          oper: between
          date_range:
            start_date: 11/29/2019
            end_date: 12/02/2019
          date_period: DAY
          for_each_period: NUM_DATE_PERIODS
      combine_type: ANY
    - name: 6 Prior Weeks
      conditions:
      - operator: BW
        column_name: Order Date
        filter_value_type: DATE_FILTER
