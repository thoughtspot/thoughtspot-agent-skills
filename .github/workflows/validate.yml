name: validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly CVE sweep (Mondays 06:00 UTC). pip-audit only fires on push/PR today, so an
    # advisory published between merges goes undetected until the next PR — this catches it
    # on a cadence (audit finding 16.3). Complements the nudge-driven external sweep.
    - cron: "0 6 * * 1"

jobs:
  validate:
    # Full validator/test suite only makes sense on a code change — skip it on the weekly
    # cron (the scheduled run does the pip-audit-only job below instead).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so checkers that diff against HEAD/refs behave correctly.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test/runtime deps
        run: |
          pip install pytest pyyaml radon pip-audit
          pip install -e tools/ts-cli

      - name: Install optional extras for audit coverage
        # Core deps are installed above; extras pull in snowflake-connector-python,
        # websocket-client, cryptography, etc. that also need CVE coverage.
        run: pip install -e "tools/ts-cli[snowflake,qlik]"

      - name: Dependency vulnerability scan (pip-audit)
        # Audits the full environment (core + optional extras) against the
        # PyPI/OSV advisory database. Fails on any known vulnerability.
        run: pip-audit

      - name: Run validators (full-repo mode)
        run: |
          set -e
          # Smoke tests are intentionally excluded — they need live ThoughtSpot /
          # Snowflake credentials and run via scripts/pre-push.sh, not in CI.
          python3 tools/validate/check_secrets.py --root . --all
          python3 tools/validate/check_references.py --root .
          python3 tools/validate/check_patterns.py --root .
          python3 tools/validate/check_version_sync.py --root .
          python3 tools/validate/check_module_health.py --root .
          python3 tools/validate/check_file_size.py --root .
          python3 tools/validate/check_yaml.py --root .
          python3 tools/validate/check_sv_yaml.py --root .
          python3 tools/validate/check_tml.py --root .
          python3 tools/validate/check_consistency.py --root .
          python3 tools/validate/check_skill_versions.py --root .
          python3 tools/validate/check_smoke_tests.py --root .
          python3 tools/validate/check_skill_naming.py --root .
          python3 tools/validate/check_skill_context_cost.py --root .
          python3 tools/validate/check_runtime_coverage.py --root .
          python3 tools/validate/check_open_items.py --root . --warn
          # Filesystem-state gates that previously ran ONLY in pre-commit (bypassable
          # via --no-verify with no server-side catch). They derive purely from repo
          # contents, so they work in a clean CI checkout.
          python3 tools/validate/check_coverage_matrix.py --root .
          python3 tools/validate/check_formula_catalog.py --root .
          python3 tools/validate/check_converter_parity.py --root .
          python3 tools/validate/check_no_v1_endpoints.py --root .
          python3 tools/validate/check_no_inline_tml_gate.py --root .
          python3 tools/validate/check_skill_cli_usage.py --root .
          # 2026-07-03 audit-harvest validators (see .claude/rules/repo-audit.md).
          python3 tools/validate/check_no_inline_requests.py --root .
          python3 tools/validate/check_pagination_convention.py --root .
          python3 tools/validate/check_slash_command_refs.py --root .
          python3 tools/validate/check_orphan_references.py --root .
          # Needs ts_cli's own typer command tree (installed above) to cross-check
          # SKILL.md `--flag` references against the real, registered CLI options.
          python3 tools/validate/check_skill_flag_usage.py --root .
          # Presence gate: every shared mapping/schema must carry a currency anchor
          # (staleness is soft and never fails — only missing/malformed anchors do).
          python3 tools/validate/check_mapping_currency.py --root . --check
          python3 tools/validate/generate_open_items_index.py --root . --check
          python3 tools/validate/check_mirror_sync.py
          python3 tools/validate/generate_parity.py --check
          # Internal-import + repo-hygiene gates (2026-07-29 audit findings 4.2/1.1/1.2).
          python3 tools/validate/check_internal_imports.py --root .
          python3 tools/validate/check_repo_hygiene.py --root .
          python3 tools/validate/check_backlog_integrity.py --root .
          # Quality gates catalog — soft baseline check here (the catalog includes
          # git-log dates that shift when any validator is touched by a contributor
          # PR, so a hard gate on every PR would force every contributor to
          # regenerate it). The PR-scoped step below promotes this to a HARD gate
          # when a PR actually touches the catalog's own sources of truth (audit
          # finding 7.1) — see that step for why CI was previously weaker than
          # pre-commit here.
          python3 tools/validate/generate_quality_gates.py --root . --check || echo "WARN  quality-gates.md is stale (non-blocking in CI)"

      - name: Open-items gate (PR only)
        # Scoped hard mode: only fails on unresolved items in open-items.md files
        # that this PR actually changed. Pre-existing items in untouched files are
        # WARN-only. Analogous to the changelog gate's --base scoping.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 tools/validate/check_open_items.py --root . \
            --base "origin/${{ github.base_ref }}"

      - name: Changelog gate (PR only)
        # The repo-changelog gate is staged-diff-based in pre-commit (empty in a CI
        # checkout). --base diffs the PR's commits against the target branch so it
        # enforces server-side too: a new skill / ts-cli bump / new shared file must
        # carry a CHANGELOG.md change in the same PR.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 tools/validate/suggest_repo_changelog.py --root . --check \
            --base "origin/${{ github.base_ref }}"

      - name: Dependency-types co-change gate (PR only)
        # CLAUDE.md's change-impact map requires ts-dependency-manager's SKILL.md /
        # open-items.md and references/dependency-types.md to move together. Until
        # 2026-08-26 that rule existed ONLY as an interactive pre-commit prompt, run
        # bare with no exit-code capture and no CI counterpart -- bypassable by
        # ignoring the prompt, by --no-verify, or by committing without a TTY
        # (audit finding 7.2). This is the missing server-side half; the local prompt
        # stays soft so ordinary commits are never blocked.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 tools/validate/suggest_dependency_types.py --root . --check \
            --base "origin/${{ github.base_ref }}"

      - name: Quality gates catalog gate (PR only, scoped hard-fail)
        # 2026-07-29 audit finding 7.1: the catalog check above is the only gate where
        # CI was WEAKER than the pre-commit hook (soft `|| echo WARN` in CI vs. a hard
        # `run_check` locally) — inverting the design principle that CI is the
        # server-side superset of pre-commit. Fixed with the same --base PR-scoping
        # pattern the changelog and open-items gates above already use: fetch the PR's
        # base ref, diff this PR's changes against it, and hard-fail ONLY when the PR
        # touched one of the catalog's own sources of truth (pre-commit.sh, this
        # workflow file, or a tools/validate/*.py validator) — exactly what
        # pre-commit.sh's own "quality gates catalog" check already triggers on
        # locally. A routine skill-only PR is untouched by this step; a gate-shape
        # change can no longer merge with a stale docs/quality-gates.md.
        if: github.event_name == 'pull_request'
        run: |
          # NOTE: these PR-gate fetches must NOT use --depth=1. A shallow fetch into
          # the full-history checkout writes .git/shallow for the base ref's tip, and
          # every later `git log` walk stops there — generate_quality_gates.py then
          # dates untouched validators as "unknown" and the catalog reads stale on
          # every run (observed on this gate's own first firing, PR #405).
          git fetch --no-tags origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          if echo "$CHANGED" | grep -qE '^(scripts/pre-commit\.sh|\.github/workflows/validate\.yml|tools/validate/.*\.py)$'; then
            echo "PR touches a quality-gates source of truth — hard-checking docs/quality-gates.md."
            python3 tools/validate/generate_quality_gates.py --root . --check
          else
            echo "No quality-gates source of truth changed in this PR — skipping hard gate (soft-checked above)."
          fi

      - name: Run unit + validator tests
        # Three separate invocations: agents/cli/ts-object-model-erd/tests and
        # agents/databricks/tests are each their own bare "tests" package
        # (tests/__init__.py, no distinguishing parent package) — same as
        # tools/ts-cli/tests. Combining same-named "tests" packages in one pytest
        # invocation collides on conftest module registration
        # (ImportPathMismatchError / "Plugin already registered under a different
        # name"). tools/validate/tests has no __init__.py, so it can safely share
        # an invocation with tools/ts-cli/tests.
        run: |
          pytest tools/ts-cli/tests/ tools/validate/tests/ -q
          pytest agents/cli/ts-object-model-erd/tests/ -q
          pytest agents/databricks/tests/ -q

      - name: Run credential-free smoke suites
        # These five assert real behaviour of publish_plan / csr_plan / apply_plan /
        # alias and need NO credentials, but ran in no CI job at all: the pytest steps
        # never touch tools/smoke-tests, the smoke_*.py prefix isn't collected by
        # pytest by default anyway, and pre-push derives its list purely from touched
        # agents/(cli|claude)/<skill>/ paths. So a PR editing only ts_cli/publish_plan.py
        # — the exact engine they guard — ran none of them, anywhere (audit 6.x).
        # Invoked directly, not via pytest: they are scripts with their own runners.
        run: |
          for s in smoke_ts_publish_orgs smoke_ts_security_columns \
                   smoke_ts_setup_tenancy smoke_ts_migrate_orgs \
                   smoke_ts_object_model_alias; do
            echo "--- $s"
            python3 "tools/smoke-tests/$s.py"
          done

  # Cross-version pytest matrix. The `validate` job above runs the full suite on 3.12; this
  # job re-runs ONLY the unit/validator tests on the rest of the declared support range
  # (pyproject `requires-python = ">=3.10,<3.15"`). Validators/linters stay single-version in
  # `validate` — this matrix exists purely to catch interpreter-specific test breakage
  # (audit finding 16.4 → BL-107; 3.14 entry also verifies the lifted cap → BL-106).
  pytest-matrix:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result — don't cancel siblings when one fails, so a single
      # interpreter-specific break is visible in isolation.
      fail-fast: false
      matrix:
        # 3.12 is covered by `validate`; this fills in the rest of requires-python.
        python-version: ["3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test/runtime deps
        run: |
          pip install pytest pyyaml
          pip install -e tools/ts-cli

      - name: Run unit + validator tests
        # Same three invocations as `validate` (see that job for why they're split).
        run: |
          pytest tools/ts-cli/tests/ tools/validate/tests/ -q
          pytest agents/cli/ts-object-model-erd/tests/ -q
          pytest agents/databricks/tests/ -q

  # Weekly scheduled CVE sweep — pip-audit ONLY (no validators/tests). Keeps the existing
  # CVE gate time-driven as well as event-driven without re-running the whole suite on cron
  # (audit finding 16.3). The push/PR pip-audit step inside `validate` is unchanged.
  scheduled-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install runtime deps + pip-audit
        run: |
          pip install pip-audit
          pip install -e "tools/ts-cli[snowflake,qlik]"

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit
