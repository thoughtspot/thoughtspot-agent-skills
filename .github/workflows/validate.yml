name: validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly CVE sweep (Mondays 06:00 UTC). pip-audit only fires on push/PR today, so an
    # advisory published between merges goes undetected until the next PR — this catches it
    # on a cadence (audit finding 16.3). Complements the nudge-driven external sweep.
    - cron: "0 6 * * 1"

jobs:
  # The full validator/linter/test suite on the primary interpreter. NOT the required
  # status check — `validate` at the bottom of this file is, and it aggregates this job
  # with `pytest-matrix`. See that job for why.
  suite:
    # Full validator/test suite only makes sense on a code change — skip it on the weekly
    # cron (the scheduled run does the pip-audit-only job below instead).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so checkers that diff against HEAD/refs behave correctly.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test/runtime deps
        run: |
          pip install pytest pyyaml radon pip-audit jsonschema==4.25.1
          pip install -e tools/ts-cli

      - name: Install optional extras for audit coverage
        # Core deps are installed above; extras pull in snowflake-connector-python,
        # websocket-client, openpyxl, cryptography, etc. that also need CVE coverage.
        run: pip install -e "tools/ts-cli[snowflake,qlik,xlsx]"

      - name: Dependency vulnerability scan (pip-audit)
        # Audits the full environment (core + optional extras) against the
        # PyPI/OSV advisory database. Fails on any known vulnerability.
        run: pip-audit

      - name: Run validators (full-repo mode)
        # The validators are listed once, in tools/validate/checks.py (CHECKS, in run
        # order). run_checks.py runs every one with CI's exact args (some import
        # ts_cli, e.g. the flag cross-check, hence the install above), keeps going
        # past a failure so one run reports them all (PR #505: three stale registries
        # took three round trips under a `set -e` chain), and exits 1 at the end if
        # any hard check failed. A soft check (the quality-gates catalog, hard-gated
        # by the PR-scoped step below) prints WARN and never fails the step.
        # Contributors run the same list locally with `--context local`.
        # tools/validate/tests/test_checks_parity.py pins this step to exactly the
        # call below. Credential-free smoke suites run in their own step at the end
        # of this job; the ones needing live ThoughtSpot / Snowflake credentials run
        # via scripts/pre-push.sh, not in CI.
        run: |
          set -e
          python3 tools/validate/run_checks.py --context ci --base origin/main

      - name: Open-items gate (PR only)
        # Scoped hard mode: only fails on unresolved items in open-items.md files
        # that this PR actually changed. Pre-existing items in untouched files are
        # WARN-only. Analogous to the changelog gate's --base scoping.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 tools/validate/check_open_items.py --root . \
            --base "origin/${{ github.base_ref }}"

      - name: Changelog gate (PR only)
        # The repo-changelog gate is staged-diff-based in pre-commit (empty in a CI
        # checkout). --base diffs the PR's commits against the target branch so it
        # enforces server-side too: a new skill / ts-cli bump / new shared file must
        # carry a CHANGELOG.md change in the same PR.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 tools/validate/suggest_repo_changelog.py --root . --check \
            --base "origin/${{ github.base_ref }}"

      - name: Dependency-types co-change gate (PR only)
        # CLAUDE.md's change-impact map requires ts-dependency-manager's SKILL.md /
        # open-items.md and references/dependency-types.md to move together. Until
        # 2026-08-26 that rule existed ONLY as an interactive pre-commit prompt, run
        # bare with no exit-code capture and no CI counterpart -- bypassable by
        # ignoring the prompt, by --no-verify, or by committing without a TTY
        # (audit finding 7.2). This is the missing server-side half; the local prompt
        # stays soft so ordinary commits are never blocked.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 tools/validate/suggest_dependency_types.py --root . --check \
            --base "origin/${{ github.base_ref }}"

      - name: Customer references in PR commits (PR only)
        # The whole-tree --all scan above sees only the final state. A link added in one
        # commit and removed in a later one is still published in the PR's history, and
        # a commit message is never in the tree at all. This scans the added lines and
        # message of every commit in the PR. One `git log -p`; needs no secrets, so it
        # also runs on fork PRs.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 tools/validate/check_customer_references.py --root . --range "origin/${{ github.base_ref }}..HEAD"

      - name: Large-PR content flag (PR only, warn-only)
        # This repo is public. A PR adding >150 files or >2 MB of non-code assets
        # (images, examples, fixtures) is where customer data hides, and the
        # customer-references gate recognises links, not names or data. Never blocks:
        # it emits a ::warning:: annotation asking for a manual content review.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 tools/validate/check_pr_size.py --root . --base "origin/${{ github.base_ref }}" --warn

      - name: Quality gates catalog gate (PR only, scoped hard-fail)
        # 2026-07-29 audit finding 7.1: the catalog check above is the only gate where
        # CI was WEAKER than the pre-commit hook (soft in CI — `|| echo WARN` then,
        # `hard=False` in checks.py now — vs. a hard `run_check` locally) —
        # inverting the design principle that CI is the server-side superset of
        # pre-commit. Fixed with the same --base PR-scoping
        # pattern the changelog and open-items gates above already use: fetch the PR's
        # base ref, diff this PR's changes against it, and hard-fail ONLY when the PR
        # touched one of the catalog's own sources of truth (pre-commit.sh, this
        # workflow file, or a tools/validate/*.py validator) — exactly what
        # pre-commit.sh's own "quality gates catalog" check already triggers on
        # locally. A routine skill-only PR is untouched by this step; a gate-shape
        # change can no longer merge with a stale docs/quality-gates.md.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          # NOTE: these PR-gate fetches must NOT use --depth=1. A shallow fetch into
          # the full-history checkout writes .git/shallow for the base ref's tip, and
          # every later `git log` walk stops there — generate_quality_gates.py then
          # dates untouched validators as "unknown" and the catalog reads stale on
          # every run (observed on this gate's own first firing, PR #405).
          git fetch --no-tags origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          if echo "$CHANGED" | grep -qE '^(scripts/pre-commit\.sh|\.github/workflows/validate\.yml|tools/validate/.*\.py)$'; then
            echo "PR touches a quality-gates source of truth — hard-checking docs/quality-gates.md."
            python3 tools/validate/generate_quality_gates.py --root . --check
          else
            echo "No quality-gates source of truth changed in this PR — skipping hard gate (soft-checked above)."
          fi

      - name: Run unit + validator tests
        # Three separate invocations: agents/cli/ts-object-model-erd/tests and
        # agents/databricks/tests are each their own bare "tests" package
        # (tests/__init__.py, no distinguishing parent package) — same as
        # tools/ts-cli/tests. Combining same-named "tests" packages in one pytest
        # invocation collides on conftest module registration
        # (ImportPathMismatchError / "Plugin already registered under a different
        # name"). tools/validate/tests has no __init__.py, so it can safely share
        # an invocation with tools/ts-cli/tests.
        if: ${{ !cancelled() }}
        run: |
          pytest tools/ts-cli/tests/ tools/validate/tests/ tools/ossie-roundtrip/tests/ tools/formula-fidelity/tests/ tools/agentql-retest/tests/ tools/quest/tests/ tools/pr-metrics/tests/ -q
          pytest agents/cli/ts-object-model-erd/tests/ -q
          pytest agents/databricks/tests/ -q

      - name: Check the CI gate covers every job
        # The aggregate `validate` job is only a gate if every non-schedule job is in its
        # `needs:`. Nothing else in the repo reads job names, so without this a new job
        # silently reproduces audit finding 7.1.
        if: ${{ !cancelled() }}
        run: |
          python3 tools/validate/check_ci_gate_coverage.py --root .

      - name: Check the audit workflow's tools are pre-approved
        if: ${{ !cancelled() }}
        run: |
          python3 tools/validate/check_audit_workflow_permissions.py --root .

      - name: Run credential-free smoke suites
        # These assert real behaviour of publish_plan / csr_plan / apply_plan /
        # alias / the dbt converters and need NO credentials, but ran in no CI job at all: the pytest steps
        # never touch tools/smoke-tests, the smoke_*.py prefix isn't collected by
        # pytest by default anyway, and pre-push derives its list purely from touched
        # agents/(cli|claude)/<skill>/ paths. So a PR editing only ts_cli/publish_plan.py
        # — the exact engine they guard — ran none of them, anywhere (audit 6.x).
        # Invoked directly, not via pytest: they are scripts with their own runners.
        # The suites are CI_SMOKES in tools/validate/checks.py; the runner runs every
        # one even after a failure and exits 1 at the end if any failed.
        if: ${{ !cancelled() }}
        run: |
          python3 tools/validate/run_checks.py --smokes

  # Cross-version pytest matrix. The `suite` job above runs the full suite on 3.12; this
  # job re-runs ONLY the unit/validator tests on the rest of the declared support range
  # (pyproject `requires-python = ">=3.10,<3.15"`). Validators/linters stay single-version in
  # `suite` — this matrix exists purely to catch interpreter-specific test breakage
  # (audit finding 16.4 → BL-107; 3.14 entry also verifies the lifted cap → BL-106).
  pytest-matrix:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result — don't cancel siblings when one fails, so a single
      # interpreter-specific break is visible in isolation.
      fail-fast: false
      matrix:
        # 3.12 is covered by `suite`; this fills in the rest of requires-python.
        python-version: ["3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test/runtime deps
        run: |
          pip install pytest pyyaml jsonschema==4.25.1
          pip install -e tools/ts-cli

      - name: Run unit + validator tests
        # Same three invocations as `suite` (see that job for why they're split).
        run: |
          pytest tools/ts-cli/tests/ tools/validate/tests/ tools/ossie-roundtrip/tests/ tools/formula-fidelity/tests/ tools/agentql-retest/tests/ tools/quest/tests/ tools/pr-metrics/tests/ -q
          pytest agents/cli/ts-object-model-erd/tests/ -q
          pytest agents/databricks/tests/ -q

  # THE REQUIRED STATUS CHECK. Branch protection requires exactly one context on `main`,
  # and before this job that context was the single-interpreter suite — so a red
  # `pytest-matrix (3.10)` reported a failure that could not block a merge (audit finding
  # 7.1: "the gate exists but is advisory"). Folding the matrix in here means the existing
  # requirement covers it, with no branch-protection change and no version numbers baked
  # into a settings page that would silently reopen the hole on the next support-range bump.
  #
  # `contains(needs.*.result, ...)` rather than naming each job: it covers any job added to
  # `needs:` later, which is the whole failure mode being fixed. (It is NOT because a
  # hyphenated name needs escaping — `needs.pytest-matrix.result` is perfectly valid; dot
  # dereference allows `-`, as `matrix.python-version` above demonstrates. An earlier
  # version of this comment claimed otherwise. The trade-off is real though: the wildcard
  # form over `needs` is undocumented, while the dot form is documented.)
  #
  # `always()` is required, or a FAILED dependency skips this job — and a skipped required
  # check does not turn the merge button red, which would reproduce the very bug this job
  # fixes, one level up. **Do not "correct" this to `!cancelled()`**: GitHub's docs prefer
  # `!cancelled()` generically, but here a cancelled run would skip the job and a skipped
  # required check counts as satisfied. `always()` is deliberate.
  validate:
    if: always() && github.event_name != 'schedule'
    needs: [suite, pytest-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate job to have succeeded
        # 'skipped' is a failure here too: on a pull_request neither dependency is skipped,
        # so a skip means someone added a condition that quietly removed a gate.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "suite=${{ needs.suite.result }} pytest-matrix=${{ needs['pytest-matrix'].result }}"
          echo "::error::A required gate job did not succeed — see the jobs above."
          exit 1

      - name: All gates green
        run: echo "suite and pytest-matrix both succeeded."

  # Weekly scheduled CVE sweep — pip-audit ONLY (no validators/tests). Keeps the existing
  # CVE gate time-driven as well as event-driven without re-running the whole suite on cron
  # (audit finding 16.3). The push/PR pip-audit step inside `suite` is unchanged.
  scheduled-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install runtime deps + pip-audit
        run: |
          pip install pip-audit
          pip install -e "tools/ts-cli[snowflake,qlik,xlsx]"

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit
